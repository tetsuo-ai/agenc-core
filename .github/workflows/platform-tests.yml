  windows-native:
    name: windows-native
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bind the checkout and install pinned npm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "tetsuo-ai/agenc-core") {
            throw "unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {
            throw "checkout is not bound to GITHUB_SHA"
          }
          if (-not [string]::IsNullOrWhiteSpace(
            (git status --porcelain=v1 --untracked-files=all | Out-String)
          )) {
            throw "checkout is not clean"
          }
          if ((node --version) -ne "v$env:NODE_VERSION") {
            throw "unexpected Node version"
          }
          $npmArchive = Join-Path $env:RUNNER_TEMP "npm-$env:NPM_VERSION.tgz"
          & node scripts/fetch-pinned-npm.mjs $npmArchive
          if ($LASTEXITCODE -ne 0) { throw "pinned npm download failed" }
          & npm.cmd install --global $npmArchive `
            --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "pinned npm install failed" }
          if ((npm.cmd --version) -ne $env:NPM_VERSION) {
            throw "unexpected npm version"
          }

      - name: Install the reviewed dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          # Exercise the install-time ABI-147 SQLite prebuild needed by the
          # built daemon lifecycle without changing the user install path.
          & npm.cmd rebuild better-sqlite3 esbuild
          if ($LASTEXITCODE -ne 0) { throw "native dependency rebuild failed" }

      - name: Build the runtime for the Windows daemon lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & npm.cmd run build --workspace=@tetsuo-ai/runtime
          if ($LASTEXITCODE -ne 0) { throw "runtime build failed" }

      - name: Run the exact Windows FND red-probe audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $redProbeOutput = & node runtime/scripts/run-fnd-red-probes.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows red-probe audit failed" }
          $expectedRedProbeOutput = `
            "red probes: files=1 expected-red=1 assertions=1 skipped=0 todo=0"
          if (($redProbeOutput | Out-String).Trim() -ne $expectedRedProbeOutput) {
            throw "Windows red-probe result contract failed: $redProbeOutput"
          }
          if (-not [string]::IsNullOrWhiteSpace(
            (git status --porcelain=v1 --untracked-files=all | Out-String)
          )) {
            throw "Windows red-probe audit dirtied the checkout"
          }

      - name: Run the exact Windows FND forced-containment contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $results = Join-Path $env:RUNNER_TEMP "windows-red-probe-containment.json"
          & node runtime/scripts/run-hermetic-vitest.mjs `
            --require-zero-skips `
            run `
            tests/fnd/red-probe-containment.test.ts `
            --allowOnly=false `
            --reporter=verbose `
            --reporter=json `
            --outputFile.json $results
          if ($LASTEXITCODE -ne 0) {
            throw "Windows red-probe forced-containment contracts failed"
          }
          @'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing red-probe containment results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const exactCounts = {
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTests: 3,
            numPassedTests: 3,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `Windows red-probe containment ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (results.success !== true || !Array.isArray(results.testResults)) {
            throw new Error("Windows red-probe containment did not report one successful file");
          }
          const expectedFiles = ["tests/fnd/red-probe-containment.test.ts"];
          const testResults = results.testResults;
          const files = testResults
            .map(({ name }) => relative(resolve("runtime"), name).split("\\").join("/"))
            .sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            throw new Error(`unexpected Windows red-probe containment files: ${JSON.stringify(files)}`);
          }
          const assertions = testResults[0].assertionResults;
          if (
            testResults[0].status !== "passed" ||
            !Array.isArray(assertions) ||
            assertions.length !== 3 ||
            assertions.some(({ status }) => status !== "passed")
          ) {
            throw new Error("Windows red-probe containment assertions were not exactly three passes");
          }
          console.log("Windows red-probe containment passed 3 tests in 1 file with zero skipped");
          '@ | node --input-type=module - $results
          if ($LASTEXITCODE -ne 0) {
            throw "Windows red-probe forced-containment result contract failed"
          }
          if (-not [string]::IsNullOrWhiteSpace(
            (git status --porcelain=v1 --untracked-files=all | Out-String)
          )) {
            throw "Windows red-probe forced-containment dirtied the checkout"
          }

      - name: Run the exact Windows FND/native capability lane
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $results = Join-Path $env:RUNNER_TEMP "windows-native-test-results.json"
          & node runtime/scripts/run-hermetic-vitest.mjs `
            --require-zero-skips `
            run `
            tests/app-server/windows-named-pipe.win32.test.ts `
            tests/durability/atomic-artifact.win32.test.ts `
            tests/fnd/benchmark-harness-faults.test.ts `
            tests/fnd/bounded-file-io.test.ts `
            tests/fnd/fnd-fixtures.test.ts `
            tests/fnd/portable-repository-path.test.ts `
            tests/fnd/process-repository-helpers.native.test.ts `
            tests/state/recovery-file.win32.test.ts `
            tests/utils/execFileNoThrow.win32.test.ts `
            tests/workspace/bound-helper-transport.win32.test.ts `
            --config vitest.native.config.ts `
            --allowOnly=false `
            --reporter=verbose `
            --reporter=json `
            --outputFile.json $results
          if ($LASTEXITCODE -ne 0) { throw "Windows native tests failed" }
          @'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing Windows-native results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const expectedFiles = [
            "tests/app-server/windows-named-pipe.win32.test.ts",
            "tests/durability/atomic-artifact.win32.test.ts",
            "tests/fnd/benchmark-harness-faults.test.ts",
            "tests/fnd/bounded-file-io.test.ts",
            "tests/fnd/fnd-fixtures.test.ts",
            "tests/fnd/portable-repository-path.test.ts",
            "tests/fnd/process-repository-helpers.native.test.ts",
            "tests/state/recovery-file.win32.test.ts",
            "tests/utils/execFileNoThrow.win32.test.ts",
            "tests/workspace/bound-helper-transport.win32.test.ts",
          ];
          const exactCounts = {
            numTotalTestSuites: 17,
            numPassedTestSuites: 17,
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTests: 90,
            numPassedTests: 90,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `Windows-native result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (results.success !== true || !Array.isArray(results.testResults)) {
            throw new Error("Windows-native result did not report success");
          }
          const files = results.testResults
            .map(result => relative(resolve("runtime"), result.name).split("\\").join("/"))
            .sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            throw new Error(
              `Windows-native files were ${JSON.stringify(files)}, expected ${JSON.stringify(expectedFiles)}`,
            );
          }
          console.log("Windows FND/native capability lane passed 90 tests in 10 files with zero skipped");
          '@ | node --input-type=module - $results
          if ($LASTEXITCODE -ne 0) { throw "Windows native result contract failed" }
          if (-not [string]::IsNullOrWhiteSpace(
            (git status --porcelain=v1 --untracked-files=all | Out-String)
          )) {
            throw "Windows native lane dirtied the checkout"
          }
