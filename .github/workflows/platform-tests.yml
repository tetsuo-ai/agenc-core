name: platform-tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: platform-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.5.0"
  NPM_VERSION: "11.17.0"

jobs:
  # The default vitest suite -- ~18,700 tests -- had no gating job at all. Every
  # other lane here runs a hosted capability slice (kernel sandbox, native,
  # Neovim, PowerShell), so a change could break the unit suite outright and
  # still show nine green checks. Four merged PRs did exactly that.
  default-suite:
    name: default-suite ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Four shards so a failing one still reports the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The FND benchmark provenance resolves the revision its baseline was
          # measured at with `git cat-file -e <rev>^{commit}`, which needs that
          # commit present. A depth-1 clone has only the tip, so the check threw
          # "benchmark source revision is not a local Git commit" the moment the
          # earlier binding assertion stopped failing first and let it run.
          fetch-depth: 0

      - name: Bind the checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tetsuo-ai/agenc-core"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install digest-pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["file"])')"
          node_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["sha256"])')"
          node_bytes="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["bytes"])')"
          npm_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["file"])')"
          npm_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["url"])')"
          npm_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["sha256"])')"

          test "$node_file" = "node-v${NODE_VERSION}-linux-x64.tar.gz"
          test "$npm_file" = "npm-${NPM_VERSION}.tgz"
          [[ "$node_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$npm_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$node_bytes" =~ ^[1-9][0-9]*$ ]]
          test "$npm_url" = "https://registry.npmjs.org/npm/-/${npm_file}"

          node_archive="$RUNNER_TEMP/$node_file"
          npm_archive="$RUNNER_TEMP/$npm_file"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "https://nodejs.org/dist/v${NODE_VERSION}/${node_file}" \
            --output "$node_archive"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "$npm_url" --output "$npm_archive"

          test "$(sha256sum "$node_archive" | awk '{print $1}')" = "$node_sha"
          test "$(sha256sum "$npm_archive" | awk '{print $1}')" = "$npm_sha"
          test "$(stat --format='%s' "$node_archive")" = "$node_bytes"

          node_root="$RUNNER_TEMP/node-distribution"
          mkdir -p "$node_root"
          tar -xzf "$node_archive" --strip-components=1 -C "$node_root"

          bundled_npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          "$node_root/bin/node" "$bundled_npm_cli" install --global \
            "$npm_archive" --prefix "$node_root" \
            --ignore-scripts --no-audit --no-fund
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test "$("$node_root/bin/node" --version)" = "v${NODE_VERSION}"
          test "$("$node_root/bin/node" "$npm_cli" --version)" = "$NPM_VERSION"

          echo "$node_root/bin" >> "$GITHUB_PATH"
          {
            echo "AGENC_NODE_EXECUTABLE_PATH=$node_root/bin/node"
            echo "AGENC_NPM_CLI_PATH=$npm_cli"
            echo "npm_config_nodedir=$node_root"
          } >> "$GITHUB_ENV"

      - name: Install the reviewed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" ci \
            --ignore-scripts --no-audit --no-fund
          npm_config_build_from_source=true \
            "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" rebuild \
              better-sqlite3 esbuild node-pty
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Put the pinned ripgrep on PATH
        shell: bash
        run: |
          set -euo pipefail
          # The agent/markdown config loader shells out to ripgrep, resolving a
          # vendored copy under dist/ first and falling back to `rg` on PATH.
          # A source-tree test run has no vendored copy, and this runner has no
          # system rg, so every markdown scan silently returned nothing and 13
          # AgentTool tests failed with empty definition lists while the files
          # sat on disk. `npm ci --ignore-scripts` does install the pinned
          # platform package -- the binary ships inside it -- so the only thing
          # missing was making it findable.
          #
          # Digest is the one runtime/scripts/run-hermetic-test-boundary.mjs
          # pins for this architecture; a mismatch must fail the job, not warn.
          rg_dir="$PWD/node_modules/@vscode/ripgrep-linux-x64/bin"
          test -x "$rg_dir/rg"
          expected="193906679498de4d939345b937fa24e0e69a03c244bd70c859f5e41232713f21"
          test "$(sha256sum "$rg_dir/rg" | awk '{print $1}')" = "$expected"
          echo "$rg_dir" >> "$GITHUB_PATH"

      - name: Typecheck the runtime and its type-checked tests
        shell: bash
        working-directory: runtime
        run: |
          set -euo pipefail
          "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" run typecheck

      - name: Run the default test suite
        shell: bash
        run: |
          set -euo pipefail
          # Sharded, with a low worker cap per shard.
          #
          # Several suites spawn real child processes and assert heartbeat
          # deadlines. On one 4-vCPU runner they lose that race: --maxWorkers=4
          # saturates the box, and dropping to 2 on a single runner only
          # doubled the wall clock without helping, because the whole suite
          # still had to fit in one machine.
          #
          # Four shards give each one the full runner for a quarter of the
          # files, so 2 workers against 4 vCPUs is genuine headroom rather than
          # a slower queue. Wall clock stays comparable because the shards run
          # side by side.
          "$AGENC_NODE_EXECUTABLE_PATH" \
            runtime/scripts/run-hermetic-vitest.mjs \
              --require-zero-skips \
              run \
              --allowOnly=false \
              --shard=${{ matrix.shard }}/4 \
              --maxWorkers=2

      - name: Assert the suite left the checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  linux-kernel-sandbox:
    name: linux-kernel-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bind the checkout and provision pinned bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tetsuo-ai/agenc-core"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(id -u)" -ne 0
          cap_eff="$(awk '$1 == "CapEff:" { print $2 }' /proc/self/status)"
          [[ "$cap_eff" =~ ^0+$ ]]

          npm_archive="$RUNNER_TEMP/npm-${NPM_VERSION}.tgz"
          node scripts/fetch-pinned-npm.mjs "$npm_archive"
          npm install --global "$npm_archive" \
            --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

          bwrap_version="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["version"])')"
          bwrap_package_version="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["ubuntu-24.04-x64"]["packageVersion"])')"
          bwrap_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["ubuntu-24.04-x64"]["file"])')"
          bwrap_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["ubuntu-24.04-x64"]["url"])')"
          bwrap_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["ubuntu-24.04-x64"]["sha256"])')"
          bwrap_bytes="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["bubblewrapTestRuntime"]["ubuntu-24.04-x64"]["bytes"])')"
          test "$bwrap_file" = "bubblewrap_${bwrap_package_version}_amd64.deb"
          [[ "$bwrap_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$bwrap_bytes" =~ ^[1-9][0-9]*$ ]]

          bwrap_archive="$RUNNER_TEMP/$bwrap_file"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "$bwrap_url" --output "$bwrap_archive"
          test "$(sha256sum "$bwrap_archive" | awk '{print $1}')" = "$bwrap_sha"
          test "$(stat --format='%s' "$bwrap_archive")" = "$bwrap_bytes"
          test "$(dpkg-deb --field "$bwrap_archive" Package)" = "bubblewrap"
          test "$(dpkg-deb --field "$bwrap_archive" Version)" = \
            "$bwrap_package_version"
          test "$(dpkg-deb --field "$bwrap_archive" Architecture)" = "amd64"
          sudo dpkg --install "$bwrap_archive"

          test "$(command -v bwrap)" = "/usr/bin/bwrap"
          test "$(dpkg-query --show --showformat='${Version}' bubblewrap)" = \
            "$bwrap_package_version"
          test -z "$(dpkg --verify bubblewrap)"
          test "$(stat --format='%U:%G:%a' /usr/bin/bwrap)" = "root:root:755"
          test ! -w /usr/bin/bwrap
          test -z "$(getcap -n /usr/bin/bwrap)"
          test "$(bwrap --version)" = "bubblewrap ${bwrap_version}"
          test "$(command -v apparmor_parser)" = "/usr/sbin/apparmor_parser"
          echo "kernel capability uses bubblewrap ${bwrap_package_version}"

      - name: Install and build the production launcher
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild
          npm run build --workspace=@tetsuo-ai/runtime
          test -x runtime/bin/agenc-linux-sandbox
          test -r runtime/dist/sandbox/linux-launcher/main.js
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Run the exact real-kernel bubblewrap lane
        shell: bash
        run: |
          set -euo pipefail
          userns_clone_path="/proc/sys/kernel/unprivileged_userns_clone"
          apparmor_userns_path="/proc/sys/kernel/apparmor_restrict_unprivileged_userns"
          profile="$RUNNER_TEMP/agenc-native-userns"
          wrapper="/opt/agenc-kernel-e2e"
          node_copy="/opt/agenc-kernel-e2e-node"
          profile_loaded=0
          wrapper_installed=0
          node_copy_installed=0

          cleanup() {
            status=$?
            trap - EXIT
            leaks_remaining=0
            mapfile -t leaked_pids < <(
              {
                pgrep -x bwrap || true
                pgrep -f -- \
                  'agenc-kernel-e2e-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' ||
                  true
                for exe_link in /proc/[0-9]*/exe; do
                  if test "$(readlink "$exe_link" 2>/dev/null || true)" = "$node_copy"; then
                    basename "$(dirname "$exe_link")"
                  fi
                done
              } | sort -un
            )
            if test "${#leaked_pids[@]}" -gt 0; then
              echo "kernel capability lane leaked process(es):" >&2
              for pid in "${leaked_pids[@]}"; do
                ps -o pid=,ppid=,stat=,args= -p "$pid" >&2 || true
                kill -TERM "$pid" 2>/dev/null || true
              done
              status=1
              for _ in {1..50}; do
                live=0
                for pid in "${leaked_pids[@]}"; do
                  if kill -0 "$pid" 2>/dev/null; then live=1; fi
                done
                if test "$live" = "0"; then break; fi
                sleep 0.1
              done
              for pid in "${leaked_pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then
                  kill -KILL "$pid" 2>/dev/null || true
                fi
              done
              for _ in {1..50}; do
                live=0
                for pid in "${leaked_pids[@]}"; do
                  if kill -0 "$pid" 2>/dev/null; then live=1; fi
                done
                if test "$live" = "0"; then break; fi
                sleep 0.1
              done
              for pid in "${leaked_pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then
                  echo "failed to terminate leaked process $pid" >&2
                  leaks_remaining=1
                  status=1
                fi
              done
            fi
            if test "$profile_loaded" = "1" &&
              test "$leaks_remaining" = "0"; then
              if ! sudo apparmor_parser -R "$profile"; then
                echo "failed to unload the kernel-test AppArmor profile" >&2
                status=1
              fi
            elif test "$profile_loaded" = "1"; then
              echo "refusing to unconfine a leaked kernel-test process" >&2
              status=1
            fi
            if sudo grep -q '^agenc-native-userns ' \
              /sys/kernel/security/apparmor/profiles; then
              echo "kernel capability lane leaked its AppArmor profile" >&2
              status=1
            fi
            if test "$wrapper_installed" = "1" &&
              test "$leaks_remaining" = "0"; then
              sudo unlink "$wrapper" || status=1
            fi
            if test "$node_copy_installed" = "1" &&
              test "$leaks_remaining" = "0"; then
              sudo unlink "$node_copy" || status=1
            fi
            if test "$(cat "$apparmor_userns_path")" != "1"; then
              echo "AppArmor user-namespace restriction changed" >&2
              status=1
            fi
            if test -r "$userns_clone_path" &&
              test "$(cat "$userns_clone_path")" != "1"; then
              echo "unprivileged user-namespace setting changed" >&2
              status=1
            fi
            if test -n "$(git status --porcelain=v1 --untracked-files=all)"; then
              echo "kernel capability lane dirtied the checkout" >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          test "$(id -u)" -ne 0
          cap_eff="$(awk '$1 == "CapEff:" { print $2 }' /proc/self/status)"
          [[ "$cap_eff" =~ ^0+$ ]]
          test -r "$apparmor_userns_path"
          test "$(cat "$apparmor_userns_path")" = "1"
          if test -r "$userns_clone_path"; then
            test "$(cat "$userns_clone_path")" = "1"
          fi
          test "$(cat /proc/sys/user/max_user_namespaces)" -gt 0
          bwrap_help="$(bwrap --help)"
          grep -Fq -- '--ro-bind-fd' <<<"$bwrap_help"
          test -e /proc/self/ns/user
          test -e /proc/self/ns/pid
          test -e /proc/self/ns/net
          test -e /proc/self/ns/mnt
          test ! -e /etc/apparmor.d/local/agenc-native-userns
          if sudo grep -q '^agenc-native-userns ' \
            /sys/kernel/security/apparmor/profiles; then
            echo "kernel-test AppArmor profile already exists" >&2
            exit 1
          fi

          denied_probe="$RUNNER_TEMP/bwrap-denied-before-profile.txt"
          if bwrap \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --ro-bind / / \
            --proc /proc \
            -- /bin/true >"$denied_probe" 2>&1; then
            echo "bubblewrap unexpectedly worked before the scoped profile" >&2
            exit 1
          fi
          grep -Eq \
            'Failed RTM_NEW(ADDR|LINK)|setting up uid map: (Permission denied|Operation not permitted)' \
            "$denied_probe"

          wrapper_source="$RUNNER_TEMP/agenc-kernel-e2e-wrapper"
          test ! -e "$wrapper"
          test ! -L "$wrapper"
          test ! -e "$node_copy"
          test ! -L "$node_copy"
          sudo install --owner=root --group=root --mode=0755 \
            "$(realpath "$(command -v node)")" "$node_copy"
          node_copy_installed=1
          test "$(stat --format='%U:%G:%a' "$node_copy")" = "root:root:755"
          test ! -w "$node_copy"
          test -z "$(getcap -n "$node_copy")"
          test "$("$node_copy" --version)" = "v${NODE_VERSION}"
          node_bin="$node_copy"
          runtime_bin="$(realpath runtime/scripts/run-hermetic-vitest.mjs)"
          node --input-type=module - \
            "$wrapper_source" "$node_bin" "$runtime_bin" \
            "$RUNNER_TEMP/agenc-home" <<'NODE'
          import { writeFileSync } from "node:fs";
          import { renderGeneratedWrapperContent } from "./packages/agenc/lib/generated-wrapper.mjs";

          const [path, nodeBin, runtimeBin, agencHome] = process.argv.slice(2);
          if (!path || !nodeBin || !runtimeBin || !agencHome) {
            throw new Error("missing generated-wrapper input");
          }
          writeFileSync(
            path,
            renderGeneratedWrapperContent({
              kind: "posix",
              nodeBin,
              runtimeBin,
              agencHome,
            }),
            { flag: "wx", mode: 0o755 },
          );
          NODE
          sudo install --owner=root --group=root --mode=0755 \
            "$wrapper_source" "$wrapper"
          wrapper_installed=1
          test "$(stat --format='%U:%G:%a' "$wrapper")" = "root:root:755"
          test ! -w "$wrapper"

          ./node_modules/.bin/tsx --eval \
            'import { renderAgenCAppArmorProfile } from "./runtime/src/sandbox/apparmor.ts"; process.stdout.write(renderAgenCAppArmorProfile(process.argv[1]));' \
            "$wrapper" > "$profile"
          grep -Fqx \
            'profile agenc-native-userns "/opt/agenc-kernel-e2e" flags=(unconfined) {' \
            "$profile"
          test "$(grep -Fxc '  userns,' "$profile")" = "1"
          sudo apparmor_parser -r "$profile"
          profile_loaded=1
          sudo grep -q '^agenc-native-userns ' \
            /sys/kernel/security/apparmor/profiles
          test "$(cat "$apparmor_userns_path")" = "1"

          results="$RUNNER_TEMP/kernel-test-results.json"
          "$wrapper" \
            --require-zero-skips \
            run \
            --config vitest.kernel.config.ts \
            --allowOnly=false \
            --reporter=verbose \
            --reporter=json \
            --outputFile.json "$results"
          node --input-type=module - "$results" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing kernel-test results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const expectedFile =
            "tests/sandbox/linux-launcher/linux-launcher.kernel.test.ts";
          const exactCounts = {
            numTotalTestSuites: 1,
            numPassedTestSuites: 1,
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTests: 2,
            numPassedTests: 2,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `kernel-test result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (
            results.success !== true ||
            !Array.isArray(results.testResults) ||
            results.testResults.length !== 1
          ) {
            throw new Error("kernel-test result did not report one successful file");
          }
          const file = relative(
            resolve("runtime"),
            results.testResults[0].name,
          ).split("\\").join("/");
          if (file !== expectedFile) {
            throw new Error(
              `kernel-test file was ${JSON.stringify(file)}, expected ${expectedFile}`,
            );
          }
          console.log(
            "real-kernel bubblewrap lane passed 2 tests in 1 file with zero skipped",
          );
          NODE

  powershell:
    name: powershell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tetsuo-ai/agenc-core"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install digest-pinned Node, npm, and PowerShell
        shell: bash
        run: |
          set -euo pipefail
          node_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["file"])')"
          node_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["sha256"])')"
          node_bytes="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeDistributions"]["linux-x64"]["bytes"])')"
          npm_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["file"])')"
          npm_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["url"])')"
          npm_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["sha256"])')"
          powershell_version="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["version"])')"
          powershell_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["linux-x64"]["file"])')"
          powershell_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["linux-x64"]["url"])')"
          powershell_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["linux-x64"]["sha256"])')"
          powershell_bytes="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["linux-x64"]["bytes"])')"

          test "$node_file" = "node-v${NODE_VERSION}-linux-x64.tar.gz"
          test "$npm_file" = "npm-${NPM_VERSION}.tgz"
          test "$powershell_file" = "powershell-${powershell_version}-linux-x64.tar.gz"
          [[ "$node_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$npm_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$powershell_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$node_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$powershell_bytes" =~ ^[1-9][0-9]*$ ]]
          test "$npm_url" = "https://registry.npmjs.org/npm/-/${npm_file}"
          test "$powershell_url" = \
            "https://github.com/PowerShell/PowerShell/releases/download/v${powershell_version}/${powershell_file}"

          node_archive="$RUNNER_TEMP/$node_file"
          npm_archive="$RUNNER_TEMP/$npm_file"
          powershell_archive="$RUNNER_TEMP/$powershell_file"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "https://nodejs.org/dist/v${NODE_VERSION}/${node_file}" \
            --output "$node_archive"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "$npm_url" --output "$npm_archive"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "$powershell_url" --output "$powershell_archive"

          test "$(sha256sum "$node_archive" | awk '{print $1}')" = "$node_sha"
          test "$(sha256sum "$npm_archive" | awk '{print $1}')" = "$npm_sha"
          test "$(sha256sum "$powershell_archive" | awk '{print $1}')" = "$powershell_sha"
          test "$(stat --format='%s' "$node_archive")" = "$node_bytes"
          test "$(stat --format='%s' "$powershell_archive")" = "$powershell_bytes"

          node_root="$RUNNER_TEMP/node-distribution"
          powershell_root="$RUNNER_TEMP/powershell-distribution"
          mkdir -p "$node_root" "$powershell_root"
          tar -xzf "$node_archive" --strip-components=1 -C "$node_root"
          tar -xzf "$powershell_archive" -C "$powershell_root"
          chmod -R a+rX,go-w "$powershell_root"
          chmod 0555 "$powershell_root/pwsh"

          bundled_npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          "$node_root/bin/node" "$bundled_npm_cli" install --global \
            "$npm_archive" --prefix "$node_root" \
            --ignore-scripts --no-audit --no-fund
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test "$("$node_root/bin/node" --version)" = "v${NODE_VERSION}"
          test "$("$node_root/bin/node" "$npm_cli" --version)" = "$NPM_VERSION"
          test "$(POWERSHELL_TELEMETRY_OPTOUT=1 \
            POWERSHELL_UPDATECHECK=Off \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            DOTNET_NOLOGO=1 \
            "$powershell_root/pwsh" -NoLogo -NoProfile -Command \
            '$PSVersionTable.PSVersion.ToString()')" = "$powershell_version"

          {
            echo "$node_root/bin"
            echo "$powershell_root"
          } >> "$GITHUB_PATH"
          {
            echo "AGENC_NODE_EXECUTABLE_PATH=$node_root/bin/node"
            echo "AGENC_NPM_CLI_PATH=$npm_cli"
            echo "npm_config_nodedir=$node_root"
            echo "POWERSHELL_TELEMETRY_OPTOUT=1"
            echo "POWERSHELL_UPDATECHECK=Off"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
          } >> "$GITHUB_ENV"

      - name: Install the reviewed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" ci \
            --ignore-scripts --no-audit --no-fund
          npm_config_build_from_source=true \
            "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" rebuild \
              better-sqlite3 esbuild node-pty
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(pwsh -NoLogo -NoProfile -Command \
            '$PSVersionTable.PSVersion.ToString()')" = \
            "$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["powershellTestRuntime"]["version"])')"

      - name: Run the exact PowerShell capability lane
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/powershell-test-results.json"
          "$AGENC_NODE_EXECUTABLE_PATH" \
            runtime/scripts/run-hermetic-vitest.mjs \
              --require-zero-skips \
              run \
              --config vitest.powershell.config.ts \
              --allowOnly=false \
              --reporter=verbose \
              --reporter=json \
              --outputFile.json "$results"
          "$AGENC_NODE_EXECUTABLE_PATH" --input-type=module - \
            "$results" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing PowerShell-test results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const expectedTests = 40;
          const expectedFiles = [
            "tests/budget/admitted-legacy-powershell.powershell.test.ts",
            "tests/packaging/install-ps1.powershell.test.ts",
            "tests/tools/PowerShellTool.execution.powershell.test.ts",
          ];
          const exactCounts = {
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTestSuites: 5,
            numPassedTestSuites: 5,
            numTotalTests: expectedTests,
            numPassedTests: expectedTests,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `PowerShell-test result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (results.success !== true || !Array.isArray(results.testResults)) {
            throw new Error("PowerShell-test result did not report success");
          }
          const files = results.testResults
            .map(result => relative(resolve("runtime"), result.name).split("\\").join("/"))
            .sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            throw new Error(
              `PowerShell-test files were ${JSON.stringify(files)}, expected ${JSON.stringify(expectedFiles)}`,
            );
          }
          console.log(
            `PowerShell capability lane passed ${expectedTests} tests in ${files.length} files with zero skipped`,
          );
          NODE

          leaked_pids="$RUNNER_TEMP/powershell-leaked-pids.txt"
          if pgrep -f -- \
            '[/]powershell-distribution/pwsh([[:space:]]|$)' \
            > "$leaked_pids"; then
            echo "PowerShell capability lane leaked process(es):" >&2
            cat "$leaked_pids" >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  neovim:
    name: neovim-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x64
            runner: ubuntu-24.04
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
          - slug: darwin-x64
            runner: macos-15-intel
          - slug: darwin-arm64
            runner: macos-15
          - slug: win-x64
            runner: windows-2025-vs2026
    # The baseline matrix cell remains runs-on: ubuntu-24.04.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AGENC_NEOVIM_RUNNER: ${{ matrix.runner }}
      AGENC_NEOVIM_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bind the checkout and hosted Neovim target
        id: neovim_manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tetsuo-ai/agenc-core"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(node --version)" = "v${NODE_VERSION}"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const toolchain = JSON.parse(
            readFileSync("release-toolchain.json", "utf8"),
          );
          const slug = process.env.AGENC_NEOVIM_SLUG;
          const runner = process.env.AGENC_NEOVIM_RUNNER;
          const expectedSlug = {
            "linux:x64": "linux-x64",
            "linux:arm64": "linux-arm64",
            "darwin:x64": "darwin-x64",
            "darwin:arm64": "darwin-arm64",
            "win32:x64": "win-x64",
          }[`${process.platform}:${process.arch}`];
          if (slug !== expectedSlug) {
            throw new Error(
              `hosted runner resolved to ${expectedSlug ?? "unsupported"}, not ${slug}`,
            );
          }
          const hosted = toolchain["neovimHostedTestRuntime"];
          if (
            hosted.schemaVersion !== 1 ||
            hosted.version !== "0.12.1" ||
            JSON.stringify(hosted.requiredTargets) !== JSON.stringify([
              "linux-x64",
              "linux-arm64",
              "darwin-x64",
              "darwin-arm64",
              "win-x64",
            ])
          ) {
            throw new Error("hosted Neovim target manifest is incomplete");
          }
          const target = hosted[slug];
          if (
            target?.runner !== runner ||
            !/^[0-9a-f]{64}$/.test(target.sha256) ||
            !Number.isSafeInteger(target.bytes) ||
            target.bytes <= 0 ||
            target.url !==
              `https://github.com/neovim/neovim/releases/download/v${hosted.version}/${target.file}`
          ) {
            throw new Error(`invalid hosted Neovim target contract for ${slug}`);
          }
          const legacy = toolchain["neovimTestRuntime"]["linux-x64"];
          if (
            slug === "linux-x64" &&
            JSON.stringify(legacy) !== JSON.stringify({
              file: target.file,
              url: target.url,
              sha256: target.sha256,
              bytes: target.bytes,
            })
          ) {
            throw new Error("hosted Linux x64 Neovim pin drifted from its release contract");
          }
          for (const [name, value] of Object.entries({
            file: target.file,
            url: target.url,
            sha256: target.sha256,
            bytes: String(target.bytes),
            executable: target.executable,
            version: hosted.version,
          })) {
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${name}=${value}\n`,
              "utf8",
            );
          }
          NODE

      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          npm_archive="$RUNNER_TEMP/npm-${NPM_VERSION}.tgz"
          node scripts/fetch-pinned-npm.mjs "$npm_archive"
          npm_command=npm
          if test "$RUNNER_OS" = "Windows"; then npm_command=npm.cmd; fi
          "$npm_command" install --global "$npm_archive" \
            --ignore-scripts --no-audit --no-fund
          test "$("$npm_command" --version)" = "$NPM_VERSION"

      - name: Provision checksum-pinned Neovim on Linux and Darwin
        if: runner.os != 'Windows'
        shell: bash
        env:
          NVIM_BYTES: ${{ steps.neovim_manifest.outputs.bytes }}
          NVIM_EXECUTABLE: ${{ steps.neovim_manifest.outputs.executable }}
          NVIM_FILE: ${{ steps.neovim_manifest.outputs.file }}
          NVIM_SHA256: ${{ steps.neovim_manifest.outputs.sha256 }}
          NVIM_URL: ${{ steps.neovim_manifest.outputs.url }}
          NVIM_VERSION: ${{ steps.neovim_manifest.outputs.version }}
        run: |
          set -euo pipefail
          neovim_archive="$RUNNER_TEMP/$NVIM_FILE"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            "$NVIM_URL" --output "$neovim_archive"
          if command -v sha256sum >/dev/null 2>&1; then
            observed_sha="$(sha256sum "$neovim_archive" | awk '{print $1}')"
          else
            observed_sha="$(shasum -a 256 "$neovim_archive" | awk '{print $1}')"
          fi
          test "$observed_sha" = "$NVIM_SHA256"
          test "$(wc -c < "$neovim_archive" | tr -d '[:space:]')" = "$NVIM_BYTES"

          neovim_root="$RUNNER_TEMP/neovim-distribution"
          mkdir -p "$neovim_root"
          tar -xzf "$neovim_archive" --strip-components=1 -C "$neovim_root"
          chmod -R a+rX,go-w "$neovim_root"
          pinned_nvim="$neovim_root/$NVIM_EXECUTABLE"
          chmod 0555 "$pinned_nvim"
          test "$("$pinned_nvim" --version | sed -n '1p')" = \
            "NVIM v${NVIM_VERSION}"
          echo "$(dirname "$pinned_nvim")" >> "$GITHUB_PATH"
          echo "AGENC_PINNED_NVIM=$pinned_nvim" >> "$GITHUB_ENV"
          echo "AGENC_BUFFER_NVIM=$pinned_nvim" >> "$GITHUB_ENV"

      - name: Provision checksum-pinned Neovim on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NVIM_BYTES: ${{ steps.neovim_manifest.outputs.bytes }}
          NVIM_EXECUTABLE: ${{ steps.neovim_manifest.outputs.executable }}
          NVIM_FILE: ${{ steps.neovim_manifest.outputs.file }}
          NVIM_SHA256: ${{ steps.neovim_manifest.outputs.sha256 }}
          NVIM_URL: ${{ steps.neovim_manifest.outputs.url }}
          NVIM_VERSION: ${{ steps.neovim_manifest.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP $env:NVIM_FILE
          Invoke-WebRequest -Uri $env:NVIM_URL -OutFile $archive
          $observedSha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($observedSha -ne $env:NVIM_SHA256) {
            throw "Neovim archive SHA-256 mismatch"
          }
          if ((Get-Item $archive).Length -ne [int64]$env:NVIM_BYTES) {
            throw "Neovim archive byte length mismatch"
          }
          $root = Join-Path $env:RUNNER_TEMP "neovim-distribution"
          New-Item -ItemType Directory -Path $root | Out-Null
          & tar.exe -xf $archive --strip-components=1 -C $root
          if ($LASTEXITCODE -ne 0) { throw "Neovim archive extraction failed" }
          $relativeExecutable = $env:NVIM_EXECUTABLE.Replace(
            "/",
            [IO.Path]::DirectorySeparatorChar
          )
          $pinnedNvim = Join-Path $root $relativeExecutable
          $versionLine = (& $pinnedNvim --version | Select-Object -First 1)
          if ($versionLine -ne "NVIM v$env:NVIM_VERSION") {
            throw "unexpected Neovim version: $versionLine"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $pinnedNvim)
          Add-Content -Path $env:GITHUB_ENV -Value "AGENC_PINNED_NVIM=$pinnedNvim"
          Add-Content -Path $env:GITHUB_ENV -Value "AGENC_BUFFER_NVIM=$pinnedNvim"

      - name: Assert checksum-pinned Neovim resolution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resolved = (Get-Command nvim -CommandType Application).Source
          if (
            [IO.Path]::GetFullPath($resolved) -ne
              [IO.Path]::GetFullPath($env:AGENC_PINNED_NVIM)
          ) {
            throw "bare nvim resolved to $resolved instead of $env:AGENC_PINNED_NVIM"
          }

      - name: Install, build, and verify the reviewed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm_command=npm
          if test "$RUNNER_OS" = "Windows"; then npm_command=npm.cmd; fi
          "$npm_command" ci --ignore-scripts --no-audit --no-fund
          if test "$RUNNER_OS" = "Windows"; then
            # Exercise the install-time ABI-147 SQLite prebuild on Windows.
            # node-pty's locked package already carries its win32-x64 prebuild;
            # rebuilding it from source would replace the user install path
            # this hosted PTY lane is intended to cover.
            "$npm_command" rebuild better-sqlite3 esbuild
          else
            npm_config_build_from_source=true \
              "$npm_command" rebuild better-sqlite3 esbuild node-pty
          fi
          "$npm_command" run build --workspace=@tetsuo-ai/runtime
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$("$npm_command" --version)" = "$NPM_VERSION"
          if test "$RUNNER_OS" != "Windows"; then
            test "$(command -v nvim)" = "$AGENC_PINNED_NVIM"
          fi
          test "$(nvim --version | sed -n '1p')" = "NVIM v0.12.1"

      - name: Run the exact real-Neovim lifecycle suite
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/neovim-test-results.json"
          node runtime/scripts/run-hermetic-vitest.mjs \
            --require-zero-skips \
            run \
            --config vitest.neovim.config.ts \
            --allowOnly=false \
            --reporter=verbose \
            --reporter=json \
            --outputFile.json "$results"
          node --input-type=module - "$results" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing Neovim-test results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const expectedFile =
            "tests/tui/workbench/buffer-neovim-lifecycle.real-neovim.test.ts";
          const exactCounts = {
            numTotalTestSuites: 2,
            numPassedTestSuites: 2,
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTests: 18,
            numPassedTests: 18,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `Neovim-test result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (
            results.success !== true ||
            !Array.isArray(results.testResults) ||
            results.testResults.length !== 1
          ) {
            throw new Error("Neovim-test result did not report one successful file");
          }
          const file = relative(
            resolve("runtime"),
            results.testResults[0].name,
          ).split("\\").join("/");
          if (file !== expectedFile) {
            throw new Error(
              `Neovim-test file was ${JSON.stringify(file)}, expected ${expectedFile}`,
            );
          }
          console.log("Neovim capability lane passed 18 tests in 1 file with zero skipped");
          NODE

      - name: Run provider and observed-descendant platform contracts
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/neovim-platform-test-results.json"
          node runtime/scripts/run-hermetic-vitest.mjs \
            --require-zero-skips \
            run \
            --config vitest.neovim-platform.config.ts \
            --allowOnly=false \
            --reporter=verbose \
            --reporter=json \
            --outputFile.json "$results"
          node --input-type=module - "$results" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing Neovim platform results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const expectedFiles = [
            "platform-tests/neovim-platform-gate.contract.test.ts",
            "platform-tests/neovim-process-tree.real.test.ts",
            "tests/tui/workbench/buffer-neovim-provider.contract.test.ts",
          ];
          const exactCounts = {
            numTotalTests: 65,
            numPassedTests: 65,
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `Neovim platform result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (results.success !== true || !Array.isArray(results.testResults)) {
            throw new Error("Neovim platform result did not report success");
          }
          const files = results.testResults
            .map((result) =>
              relative(resolve("runtime"), result.name).split("\\").join("/")
            )
            .sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            throw new Error(
              `Neovim platform files were ${JSON.stringify(files)}, expected ${JSON.stringify(expectedFiles)}`,
            );
          }
          console.log(
            "Neovim provider/observed-descendant platform lane passed 65 tests in 3 files with zero skipped",
          );
          NODE

      - name: Run the required hosted-platform PTY scenarios
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/neovim-platform-tui.log"
          node runtime/scripts/check-tui-e2e/runner.mjs --platform \
            "$AGENC_NEOVIM_SLUG" | tee "$log"
          grep -F "2/2 passed" "$log"

      - name: Assert hosted-platform cleanup and checkout integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test "$RUNNER_OS" = "Windows"; then
            AGENC_PINNED_NVIM="$AGENC_PINNED_NVIM" powershell.exe \
              -NoLogo -NoProfile -NonInteractive -Command '
                $expected = [IO.Path]::GetFullPath($env:AGENC_PINNED_NVIM)
                $leaks = Get-CimInstance Win32_Process |
                  Where-Object {
                    $_.ProcessId -ne $PID -and
                      (
                        ($_.ExecutablePath -and
                          [IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected) -or
                        ($_.CommandLine -and
                          ($_.CommandLine.Contains("agenc-neovim-platform-descendant") -or
                            $_.CommandLine.Contains("agenc-process-owner-watchdog")))
                      )
                  }
                if ($leaks) {
                  $leaks | Format-List ProcessId,ParentProcessId,ExecutablePath
                  throw "hosted Neovim lane leaked a child process"
                }
              '
          else
            if pgrep -f -- "$AGENC_PINNED_NVIM" >/dev/null; then
              pgrep -af -- "$AGENC_PINNED_NVIM" >&2
              echo "real-Neovim capability lane leaked a child process" >&2
              exit 1
            fi
            if pgrep -f -- "agenc-neovim-platform-descendant" >/dev/null; then
              pgrep -af -- "agenc-neovim-platform-descendant" >&2
              echo "real-Neovim capability lane leaked a detached job" >&2
              exit 1
            fi
            if pgrep -f -- "agenc-process-owner-watchdog" >/dev/null; then
              pgrep -af -- "agenc-process-owner-watchdog" >&2
              echo "real-Neovim capability lane leaked an owner watchdog" >&2
              exit 1
            fi
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  macos-native:
    name: macos-native
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bind the checkout and install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tetsuo-ai/agenc-core"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(node --version)" = "v${NODE_VERSION}"
          npm_archive="$RUNNER_TEMP/npm-${NPM_VERSION}.tgz"
          node scripts/fetch-pinned-npm.mjs "$npm_archive"
          npm install --global "$npm_archive" \
            --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install the reviewed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm_config_build_from_source=true \
            npm rebuild better-sqlite3 esbuild node-pty

      - name: Run the exact macOS red-probe runner contract
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/macos-red-probe-runner.json"
          node runtime/scripts/run-hermetic-vitest.mjs \
            --require-zero-skips \
            run \
            tests/fnd/red-probe-runner.contract.test.ts \
            --allowOnly=false \
            --reporter=verbose \
            --reporter=json \
            --outputFile.json "$results"
          node --input-type=module - "$results" <<'NODE'
          import { readFileSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const [resultsPath] = process.argv.slice(2);
          if (!resultsPath) throw new Error("missing macOS red-probe results path");
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const exactCounts = {
            numTotalTests: 67,
