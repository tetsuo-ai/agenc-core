# Build per-platform runtime tarballs from the committed lockfile.
#
# Runs on demand (workflow_dispatch). Each matrix job builds the same artifact
# twice on its native runner and uploads it only when tarball + sidecar bytes
# match exactly.
# Linux native dependencies build in a glibc 2.28 container so the generic
# linux artifacts retain Node's Tier-1 compatibility baseline.
#
# This is an artifact-build workflow, not a replacement for the local test
# plan. Its native jobs additionally run the exact macOS and Windows integration
# probes that Linux cannot execute. Candidate mode runs this matrix on the
# final untagged main SHA. The operator permanently escrows its sealed files in
# a derived immutable prerelease before tagging. Tagged mode requires that exact
# successful candidate, downloads only from the escrow, verifies its sealed
# native artifacts, and adds immutable-tag attestations without rebuilding on
# mutable hosted infrastructure. Before dispatch, the
# operator must complete and retain the exact-SHA local release evidence defined
# in docs/ci-required-gates.md. Publishing stays local/operator-driven (no
# cross-repository write secret in this workflow). The reviewed draft, explicit
# destination tag, artifact attestation, immutable publication, and downstream
# npm/Docker/Homebrew sequence are documented in docs/install.md under
# "Reproducible release gate".

name: release-runtime
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Untagged candidate build or immutable tagged promotion
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - tagged
      candidate_run_id:
        description: Successful candidate run to promote; use 0 for candidate phase
        required: true
        default: "0"
        type: string
      tested_sha:
        description: Full immutable release commit tested locally
        required: true
        type: string
      local_evidence_sha256:
        description: SHA-256 of the reviewed local release evidence record
        required: true
        type: string

concurrency:
  group: release-runtime-${{ inputs.phase }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  NODE_VERSION: "26.5.0"
  NPM_VERSION: "11.17.0"
  npm_config_build_from_source: "true"
  LINUX_BUILDER_IMAGE: "rockylinux@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c"

jobs:
  release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-escrow-tag: ${{ steps.bind-release-source.outputs.candidate-escrow-tag }}
      candidate-run-attempt: ${{ steps.bind-release-source.outputs.candidate-run-attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Bind the run to the reviewed release source
        id: bind-release-source
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          LOCAL_EVIDENCE_SHA256: ${{ inputs.local_evidence_sha256 }}
          RELEASE_PHASE: ${{ inputs.phase }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag_exists() {
            git show-ref --verify --quiet "$1"
          }
          require_first_workflow_attempt() {
            if test "$1" != "1"; then
              echo "candidate runs cannot be retried; dispatch a fresh candidate workflow" >&2
              return 1
            fi
          }
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LOCAL_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$TESTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = tetsuo-ai/agenc-core
          test "$REPOSITORY_VISIBILITY" = public
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_VERSION="$version"
          expected_ref="refs/tags/agenc-v${version}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$RELEASE_PHASE" in
            candidate)
              test "$CANDIDATE_RUN_ID" = "0"
              require_first_workflow_attempt "$GITHUB_RUN_ATTEMPT"
              test "$GITHUB_REF_TYPE" = "branch"
              test "$GITHUB_REF" = "refs/heads/main"
              test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
              if release_tag_exists "$expected_ref"; then
                echo "candidate phase refuses an already-consumed release tag: $expected_ref" >&2
                exit 1
              fi
              ;;
            tagged)
              [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$GITHUB_REF_TYPE" = "tag"
              test "$GITHUB_REF" = "$expected_ref"
              test "$(git rev-parse --verify "${expected_ref}^{commit}")" = "$GITHUB_SHA"
              python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["CANDIDATE_RUN_ID"])
          tested_sha = os.environ["TESTED_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"

          def get(
              path,
              api_root=api_root,
              api_version="2022-11-28",
              authenticated=True,
          ):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "agenc-release-candidate-verifier",
                  "X-GitHub-Api-Version": api_version,
              }
              if authenticated:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(
                  f"{api_root}{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"GitHub API returned {response.status} for {path}")
                  return json.load(response)

          workflow = get("/actions/workflows/release-runtime.yml")
          run = get(f"/actions/runs/{run_id}")
          expected_run = {
              "workflow_id": workflow["id"],
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": tested_sha,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in expected_run.items():
              if run.get(field) != expected:
                  raise SystemExit(
                      f"candidate run {field} was {run.get(field)!r}, expected {expected!r}"
                  )
          run_attempt = 1
          jobs = get(
              f"/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100"
          )
          expected_jobs = {
              "release-source",
              "hosted-toolchain-preflight (macos-15, darwin-arm64)",
              "hosted-toolchain-preflight (macos-15-intel, darwin-x64)",
              "hosted-toolchain-preflight (windows-2025-vs2026, win-x64)",
              "linux-tarball (ubuntu-24.04, linux-x64)",
              "linux-tarball (ubuntu-24.04-arm, linux-arm64)",
              "native-tarball (macos-15, darwin-arm64)",
              "native-tarball (macos-15-intel, darwin-x64)",
              "native-tarball (windows-2025-vs2026, win-x64)",
              "candidate-seal",
          }
          all_jobs = jobs.get("jobs", [])
          successful_jobs = [
              job["name"]
              for job in all_jobs
              if job.get("status") == "completed" and job.get("conclusion") == "success"
          ]
          unexpected_jobs = [
              (job.get("name"), job.get("status"), job.get("conclusion"))
              for job in all_jobs
              if not (
                  (
                      job.get("name") in expected_jobs
                      and job.get("status") == "completed"
                      and job.get("conclusion") == "success"
                  )
                  or (
                      str(job.get("name", "")).startswith("promote-candidate-artifacts")
                      and job.get("status") == "completed"
                      and job.get("conclusion") == "skipped"
                  )
              )
          ]
          if (
              len(successful_jobs) != len(expected_jobs)
              or set(successful_jobs) != expected_jobs
              or unexpected_jobs
          ):
              raise SystemExit(
                  "candidate job inventory mismatch: "
                  f"successful={sorted(successful_jobs)!r}, unexpected={unexpected_jobs!r}"
              )

          version = os.environ["RELEASE_VERSION"]
          release_repository = "tetsuo-ai/agenc-releases"
          candidate_tag = f"agenc-candidate-v{version}-run-{run_id}"
          release_api_root = (
              f"https://api.github.com/repos/{release_repository}"
          )
          candidate_release = get(
              f"/releases/tags/{candidate_tag}",
              api_root=release_api_root,
              api_version="2026-03-10",
              authenticated=False,
          )
          expected_release = {
              "tag_name": candidate_tag,
              "draft": False,
              "prerelease": True,
              "immutable": True,
          }
          for field, expected in expected_release.items():
              if candidate_release.get(field) != expected:
                  raise SystemExit(
                      f"candidate escrow {field} was "
                      f"{candidate_release.get(field)!r}, expected {expected!r}"
                  )
          if (
              not isinstance(candidate_release.get("id"), int)
              or candidate_release["id"] < 1
          ):
              raise SystemExit("candidate escrow release ID is invalid")

          slugs = (
              "linux-x64",
              "linux-arm64",
              "darwin-x64",
              "darwin-arm64",
              "win-x64",
          )
          seal_name = "agenc-runtime-candidate-seal.json"
          seal_bundle_name = f"{seal_name}.sigstore.json"
          expected_asset_names = {seal_name, seal_bundle_name}
          for slug in slugs:
              archive = (
                  f"agenc-runtime-{version}-{slug}-node26-abi147.tar.gz"
              )
              expected_asset_names.update(
                  (archive, f"{archive}.meta.json", f"{archive}.sigstore.json")
              )
          release_assets = candidate_release.get("assets")
          if not isinstance(release_assets, list):
              raise SystemExit("candidate escrow assets are not a list")
          asset_by_name = {
              asset.get("name"): asset
              for asset in release_assets
              if isinstance(asset, dict) and isinstance(asset.get("name"), str)
          }
          if (
              len(release_assets) != 17
              or len(asset_by_name) != 17
              or set(asset_by_name) != expected_asset_names
          ):
              raise SystemExit(
                  "candidate escrow asset inventory mismatch: "
                  f"{sorted(asset_by_name)!r}"
              )
          for name, asset in asset_by_name.items():
              expected_url = (
                  f"https://github.com/{release_repository}/releases/download/"
                  f"{candidate_tag}/{name}"
              )
              if (
                  not isinstance(asset.get("id"), int)
                  or asset["id"] < 1
                  or type(asset.get("size")) is not int
                  or asset["size"] < 1
                  or not isinstance(asset.get("digest"), str)
                  or not re.fullmatch(
                      r"sha256:[0-9a-f]{64}",
                      asset["digest"],
                  )
                  or asset.get("browser_download_url") != expected_url
              ):
                  raise SystemExit(
                      f"candidate escrow asset identity is invalid for {name}"
                  )

          def download_asset(name):
              asset = asset_by_name[name]
              request = urllib.request.Request(
                  asset["browser_download_url"],
                  headers={
                      "Accept": "application/octet-stream",
                      "User-Agent": "agenc-release-candidate-verifier",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(
                          f"candidate escrow download returned "
                          f"{response.status} for {name}"
                      )
                  payload = response.read(4 * 1024 * 1024 + 1)
              digest = hashlib.sha256(payload).hexdigest()
              if (
                  len(payload) != asset["size"]
                  or asset["digest"] != f"sha256:{digest}"
              ):
                  raise SystemExit(
                      f"candidate escrow API/download identity drifted for {name}"
                  )
              return payload

          receipt_bytes = download_asset(seal_name)
          download_asset(seal_bundle_name)
          try:
              receipt = json.loads(receipt_bytes)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"candidate escrow receipt is invalid: {error}")
          expected_receipt_keys = {
              "artifacts",
              "evidenceSha256",
              "phase",
              "runAttempt",
              "runId",
              "runUrl",
              "schemaVersion",
              "sha",
              "successfulJobs",
              "workflow",
          }
          if not isinstance(receipt, dict) or set(receipt) != expected_receipt_keys:
              raise SystemExit("candidate escrow receipt keys are not exact")
          expected_receipt = {
              "schemaVersion": 1,
              "workflow": "release-runtime.yml",
              "phase": "candidate",
              "runId": run_id,
              "runAttempt": run_attempt,
              "runUrl": (
                  f"https://github.com/{repository}/actions/runs/{run_id}"
              ),
              "sha": tested_sha,
              "evidenceSha256": os.environ["LOCAL_EVIDENCE_SHA256"],
          }
          for field, expected in expected_receipt.items():
              if receipt.get(field) != expected:
                  raise SystemExit(
                      f"candidate escrow receipt {field} was "
                      f"{receipt.get(field)!r}, expected {expected!r}"
                  )
          successful_jobs = receipt.get("successfulJobs")
          if (
              not isinstance(successful_jobs, list)
              or any(not isinstance(name, str) for name in successful_jobs)
              or len(successful_jobs) != len(set(successful_jobs))
              or set(successful_jobs) != expected_jobs
          ):
              raise SystemExit(
                  "candidate escrow receipt successful jobs are not exact"
              )
          records = receipt.get("artifacts")
          expected_record_names = {
              f"agenc-runtime-{slug}" for slug in slugs
          }
          if not isinstance(records, dict) or set(records) != expected_record_names:
              raise SystemExit(
                  "candidate escrow receipt artifact inventory is not exact"
              )
          for slug in slugs:
              record = records[f"agenc-runtime-{slug}"]
              expected_record_keys = {
                  "archive",
                  "archiveBytes",
                  "archiveSha256",
                  "candidateBundleBytes",
                  "candidateBundleSha256",
                  "metadataBytes",
                  "metadataSha256",
              }
              if not isinstance(record, dict) or set(record) != expected_record_keys:
                  raise SystemExit(
                      f"candidate escrow receipt record is invalid for {slug}"
                  )
              archive = (
                  f"agenc-runtime-{version}-{slug}-node26-abi147.tar.gz"
              )
              expected_identities = {
                  archive: ("archiveBytes", "archiveSha256"),
                  f"{archive}.meta.json": (
                      "metadataBytes",
                      "metadataSha256",
                  ),
                  f"{archive}.sigstore.json": (
                      "candidateBundleBytes",
                      "candidateBundleSha256",
                  ),
              }
              if record.get("archive") != archive:
                  raise SystemExit(
                      f"candidate escrow receipt archive is invalid for {slug}"
                  )
              for name, (bytes_field, digest_field) in expected_identities.items():
                  asset = asset_by_name[name]
                  if (
                      asset["size"] != record.get(bytes_field)
                      or asset["digest"] != f"sha256:{record.get(digest_field)}"
                  ):
                      raise SystemExit(
                          f"candidate escrow API digest is detached for {name}"
                      )
          print(
              f"approved candidate run {run_id} at {tested_sha} "
              f"with {len(expected_jobs)} jobs and immutable escrow "
              f"{candidate_tag} ({len(expected_asset_names)} assets)"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate-escrow-tag={candidate_tag}\n")
              output.write(f"candidate-run-attempt={run_attempt}\n")
          PY
              ;;
            *)
              echo "unsupported release phase: $RELEASE_PHASE" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  hosted-toolchain-preflight:
    name: hosted-toolchain-preflight (${{ matrix.runner }}, ${{ matrix.slug }})
    if: inputs.phase == 'candidate'
    needs: release-source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            slug: darwin-arm64
          - runner: macos-15-intel
            slug: darwin-x64
          - runner: windows-2025-vs2026
            slug: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      AGENC_RELEASE_SLUG: ${{ matrix.slug }}
      AGENC_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Reject retried candidate preflights
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            echo "candidate preflights cannot be retried; dispatch a fresh candidate workflow" >&2
            exit 1
          }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate the reviewed macOS image and native toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-hosted-macos-runner.py \
            --report "$RUNNER_TEMP/agenc-hosted-toolchain-${AGENC_RELEASE_SLUG}.json"
      - name: Validate the reviewed Windows image and native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/validate-hosted-windows-runner.ps1 `
            -ReportPath "$env:RUNNER_TEMP/agenc-hosted-toolchain-$env:AGENC_RELEASE_SLUG.json"
      - name: Print the observed macOS toolchain report
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          report="$RUNNER_TEMP/agenc-hosted-toolchain-${AGENC_RELEASE_SLUG}.json"
          if test -f "$report"; then
            cat "$report"
          else
            echo "hosted toolchain validator did not produce $report" >&2
          fi
      - name: Print the observed Windows toolchain report
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/agenc-hosted-toolchain-$env:AGENC_RELEASE_SLUG.json"
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            Get-Content -Raw -LiteralPath $report
          } else {
            Write-Error "hosted toolchain validator did not produce $report"
          }

  linux-tarball:
    name: linux-tarball (${{ matrix.runner }}, ${{ matrix.slug }})
    if: inputs.phase == 'candidate'
    needs:
      - release-source
      - hosted-toolchain-preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      AGENC_RELEASE_CANDIDATE_EVIDENCE_SHA256: ${{ inputs.local_evidence_sha256 }}
      AGENC_RELEASE_CANDIDATE_PHASE: candidate
      AGENC_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
      AGENC_RELEASE_CANDIDATE_RUN_ID: ${{ github.run_id }}
      AGENC_RELEASE_CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENC_RELEASE_CANDIDATE_SOURCE_REF: refs/heads/main
      AGENC_RELEASE_CANDIDATE_WORKFLOW: release-runtime.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            slug: linux-x64
          - runner: ubuntu-24.04-arm
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: rockylinux@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
    timeout-minutes: 45
    steps:
      - name: Reject retried candidate artifact production
        shell: bash
        run: |
          set -euo pipefail
          require_first_workflow_attempt() {
            if test "$1" != "1"; then
              echo "candidate artifact jobs cannot be retried; dispatch a fresh candidate workflow" >&2
              return 1
            fi
          }
          require_first_workflow_attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install glibc 2.28 build prerequisites
        run: |
          dnf install -y --setopt=gpgcheck=1 \
            libatomic-8.5.0-28.el8_10 \
            libgcc-8.5.0-28.el8_10 \
            gcc-toolset-12-gcc-c++-12.2.1-7.8.el8_10 \
            gcc-toolset-12-binutils-2.38-17.el8 \
            kernel-headers-4.18.0-553.150.1.el8_10 \
            python3.12-3.12.13-2.el8_10 \
            make-4.2.1-11.el8 \
            git-2.43.7-1.el8_10 \
            tar-1.30-11.el8_10 \
            gzip-1.9-13.el8_5
          dnf clean all
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Bind the immutable Node compatibility bootstrap release
        id: node_bootstrap_release
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_version="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeBootstrap"]["minimumRuntimeVersion"])')"
          bootstrap_tag="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeBootstrap"]["releaseTag"])')"
          test "$bootstrap_tag" = "agenc-v${bootstrap_version}"
          if test "$GITHUB_REF" = "refs/tags/${bootstrap_tag}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "AGENC_PUBLISH_NODE_BOOTSTRAP=true" >> "$GITHUB_ENV"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "AGENC_PUBLISH_NODE_BOOTSTRAP=false" >> "$GITHUB_ENV"
          fi
      - name: Activate and inventory the pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolset=/opt/rh/gcc-toolset-12/root/usr/bin
          echo "$toolset" >> "$GITHUB_PATH"
          echo "CC=$toolset/gcc" >> "$GITHUB_ENV"
          echo "CXX=$toolset/g++" >> "$GITHUB_ENV"
          echo "PYTHON=/usr/bin/python3.12" >> "$GITHUB_ENV"
          echo "npm_config_python=/usr/bin/python3.12" >> "$GITHUB_ENV"
          rpm -qa --qf '%{NAME}|%{EPOCHNUM}|%{VERSION}|%{RELEASE}|%{ARCH}|%{SHA256HEADER}|%{PAYLOADDIGEST}|%{PAYLOADDIGESTALGO}|%{RSAHEADER:pgpsig}\n' \
            > "$RUNNER_TEMP/rpm-content-inventory.raw"
          python3.12 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re

          architecture = {"x86_64": "x64", "aarch64": "arm64"}[platform.machine()]
          with open("release-toolchain.json", encoding="utf-8") as source:
              toolchain = json.load(source)
          contract = toolchain["linux"]["rpmContentInventory"]
          if contract != {
              "schemaVersion": 1,
              "format": "name|epoch|version|release|arch|sha256header|payloaddigest|payloaddigestalgo|rsaheader-pgpsig",
              "signatureKeyIds": ["15af5dac6d745a60"],
              "sha256": contract.get("sha256"),
          }:
              raise SystemExit("invalid reviewed RPM content-inventory contract")
          allowed_signers = set(contract["signatureKeyIds"])
          with open(os.path.join(os.environ["RUNNER_TEMP"], "rpm-content-inventory.raw"), encoding="utf-8") as source:
              lines = [line.rstrip("\n") for line in source if line.rstrip("\n")]
          lines = [line for line in lines if line.split("|", 1)[0] != "gpg-pubkey"]
          observed_signers = set()
          for line in lines:
              fields = line.split("|")
              if len(fields) != 9:
                  raise SystemExit("malformed RPM content inventory line")
              name, epoch, version, release, rpm_arch, header_sha, payload_sha, algorithm, signature = fields
              match = re.search(r"(?:^|, )Key ID ([0-9a-f]{16})$", signature)
              if (
                  not re.fullmatch(r"[A-Za-z0-9+_.-]+", name)
                  or not epoch.isdigit()
                  or not version
                  or not release
                  or rpm_arch not in {"aarch64", "noarch", "x86_64"}
                  or not re.fullmatch(r"[0-9a-f]{64}", header_sha)
                  or not re.fullmatch(r"[0-9a-f]{64}", payload_sha)
                  or algorithm != "8"
                  or match is None
                  or match.group(1) not in allowed_signers
              ):
                  raise SystemExit(f"unapproved signed RPM content identity: {name}")
              observed_signers.add(match.group(1))
          if observed_signers != allowed_signers:
              raise SystemExit("installed RPM signer set does not match the reviewed contract")
          canonical = "\n".join(sorted(lines, key=lambda value: value.encode("utf-8"))) + "\n"
          inventory_sha = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          expected_sha = contract["sha256"][architecture]
          if inventory_sha != expected_sha:
              print("::group::observed signed RPM content inventory")
              print(canonical, end="")
              print("::endgroup::")
              raise SystemExit(
                  f"signed RPM content inventory drift for {architecture}: {inventory_sha} != {expected_sha}"
              )
          with open(os.path.join(os.environ["RUNNER_TEMP"], "rpm-content-inventory.txt"), "w", encoding="utf-8", newline="\n") as output:
              output.write(canonical)
          builder = f'{toolchain["linux"]["containerImage"]}+rpm-content-sha256:{inventory_sha}'
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as environment:
              environment.write(f"AGENC_BUILDER_ID={builder}\n")
              environment.write(f"AGENC_RPM_CONTENT_INVENTORY_SHA256={inventory_sha}\n")
          print(f"approved {len(lines)} signed RPM payloads ({inventory_sha})")
          PY
      - name: Install digest-pinned Node, headers, and npm
        shell: bash
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          node_file="$(python3.12 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["file"])')"
          node_sha="$(python3.12 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["sha256"])')"
          node_bytes="$(python3.12 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["bytes"])')"
          headers_file="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["file"])')"
          headers_sha="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["sha256"])')"
          headers_bytes="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["bytes"])')"
          npm_file="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["file"])')"
          npm_url="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["url"])')"
          npm_sha="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["sha256"])')"
          node_archive="$RUNNER_TEMP/$node_file"
          headers_archive="$RUNNER_TEMP/$headers_file"
          npm_archive="$RUNNER_TEMP/$npm_file"
          python3.12 - "$node_archive" "$node_sha" "$node_bytes" "$headers_archive" "$headers_sha" "$headers_bytes" "$npm_archive" "$npm_sha" "$npm_url" "$NODE_VERSION" "$node_file" "$headers_file" <<'PY'
          import hashlib
          import pathlib
          import sys
          import urllib.request

          node_path, node_sha, node_bytes, headers_path, headers_sha, headers_bytes, npm_path, npm_sha, npm_url, version, node_file, headers_file = sys.argv[1:]
          for url, destination, expected_sha, expected_bytes in (
              (f"https://nodejs.org/dist/v{version}/{node_file}", node_path, node_sha, int(node_bytes)),
              (f"https://nodejs.org/dist/v{version}/{headers_file}", headers_path, headers_sha, int(headers_bytes)),
              (npm_url, npm_path, npm_sha, None),
          ):
              urllib.request.urlretrieve(url, destination)
              downloaded = pathlib.Path(destination).read_bytes()
              if expected_bytes is not None and len(downloaded) != expected_bytes:
                  raise SystemExit(
                      f"byte count mismatch for {url}: {len(downloaded)} != {expected_bytes}"
                  )
              actual_sha = hashlib.sha256(downloaded).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f"digest mismatch for {url}: {actual_sha} != {expected_sha}")
          PY
          node_root="$RUNNER_TEMP/node-distribution"
          headers_parent="$RUNNER_TEMP/node-headers"
          mkdir -p "$node_root" "$headers_parent"
          tar -xzf "$node_archive" --strip-components=1 -C "$node_root"
          tar -xzf "$headers_archive" -C "$headers_parent"
          headers_root="$headers_parent/node-v${NODE_VERSION}"
          test -f "$headers_root/include/node/node.h"
          expected_libatomic="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["linux"]["builderPackages"]["libatomic"])')"
          actual_libatomic="$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}' libatomic)"
          test "$actual_libatomic" = "$expected_libatomic"
          expected_libgcc="$(python3.12 -c 'import json; print(json.load(open("release-toolchain.json"))["linux"]["builderPackages"]["libgcc"])')"
          actual_libgcc="$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}' libgcc)"
          test "$actual_libgcc" = "$expected_libgcc"
          node_shared_libraries="$(ldd "$node_root/bin/node" 2>&1)"
          printf '%s\n' "$node_shared_libraries"
          if grep -F 'not found' <<<"$node_shared_libraries"; then
            echo "portable Node has unresolved shared libraries" >&2
            exit 1
          fi
          grep -F 'libatomic.so.1 => /' <<<"$node_shared_libraries"
          libatomic_path="$(readlink -f /usr/lib64/libatomic.so.1)"
          copying3=/usr/share/licenses/libgcc/COPYING3
          copying_runtime=/usr/share/licenses/libgcc/COPYING.RUNTIME
          test -f "$libatomic_path"
          test -f "$copying3"
          test -f "$copying_runtime"
          libatomic_license="$RUNNER_TEMP/LIBATOMIC-LICENSE"
          cat "$copying3" > "$libatomic_license"
          printf '\n--- GCC Runtime Library Exception 3.1 ---\n\n' >> "$libatomic_license"
          cat "$copying_runtime" >> "$libatomic_license"
          python3.12 - "$libatomic_path" "$copying3" "$copying_runtime" "$libatomic_license" "${{ matrix.slug }}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          library, copying3, runtime_exception, combined = map(pathlib.Path, sys.argv[1:5])
          slug = sys.argv[5]
          with open("release-toolchain.json", encoding="utf-8") as source:
              contract = json.load(source)["nodeBootstrap"]
          expected = contract[slug]
          checks = (
              (library, expected["librarySha256"], expected["libraryBytes"], "libatomic"),
              (copying3, contract["licenses"]["copying3Sha256"], contract["licenses"]["copying3Bytes"], "GPLv3"),
              (runtime_exception, contract["licenses"]["runtimeExceptionSha256"], contract["licenses"]["runtimeExceptionBytes"], "runtime exception"),
              (combined, contract["licenses"]["combinedSha256"], contract["licenses"]["combinedBytes"], "combined license"),
          )
          for path, expected_sha, expected_bytes, label in checks:
              payload = path.read_bytes()
              actual_sha = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected_bytes or actual_sha != expected_sha:
                  raise SystemExit(
                      f"{label} identity drift: {len(payload)}/{actual_sha} != {expected_bytes}/{expected_sha}"
                  )
          PY
          "$node_root/bin/node" "$node_root/lib/node_modules/npm/bin/npm-cli.js" \
            install --global "$npm_archive" --prefix "$node_root" \
            --ignore-scripts --no-audit --no-fund
          node_executable="$node_root/bin/node"
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test "$("$node_executable" --version)" = "v$NODE_VERSION"
          test "$("$node_executable" "$npm_cli" --version)" = "$NPM_VERSION"
          echo "$node_root/bin" >> "$GITHUB_PATH"
          echo "AGENC_NODE_EXECUTABLE_PATH=$node_executable" >> "$GITHUB_ENV"
          echo "AGENC_NPM_CLI_PATH=$npm_cli" >> "$GITHUB_ENV"
          echo "npm_config_nodedir=$headers_root" >> "$GITHUB_ENV"
          echo "AGENC_NODE_DISTRIBUTION_SHA256=$node_sha" >> "$GITHUB_ENV"
          echo "AGENC_NODE_HEADERS_SHA256=$headers_sha" >> "$GITHUB_ENV"
          echo "AGENC_NPM_DISTRIBUTION_SHA256=$npm_sha" >> "$GITHUB_ENV"
          echo "AGENC_NODE_LIBATOMIC_PATH=$libatomic_path" >> "$GITHUB_ENV"
          echo "AGENC_LIBATOMIC_LICENSE_PATH=$libatomic_license" >> "$GITHUB_ENV"
      - name: Build the immutable Node compatibility bootstrap
        if: steps.node_bootstrap_release.outputs.publish == 'true'
        shell: bash
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          bootstrap_file="$(python3.12 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeBootstrap"][os.environ["AGENC_RELEASE_SLUG"]]["file"])')"
          bootstrap_archive="$RUNNER_TEMP/$bootstrap_file"
          packages/agenc/scripts/build-node-bootstrap.sh \
            "$AGENC_RELEASE_SLUG" "$bootstrap_archive"
          echo "AGENC_NODE_BOOTSTRAP_PATH=$bootstrap_archive" >> "$GITHUB_ENV"
      - name: Build from two isolated worktrees and compare bytes
        env:
          AGENC_MAX_GLIBC: "2.28"
          AGENC_MAX_GLIBCXX: "3.4.25"
          AGENC_MAX_CXXABI: "1.3.11"
        run: |
          set -euo pipefail
          umask 022
          test "$(gcc -dumpfullversion)" = "12.2.1"
          test "$(g++ -dumpfullversion)" = "12.2.1"
          ld --version | head -1 | grep -F '2.38'
          test "$(python3.12 -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          test "$("$AGENC_NODE_EXECUTABLE_PATH" --version)" = "v$NODE_VERSION"
          test "$("$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" --version)" = "$NPM_VERSION"
          source_root="$(pwd -P)"
          # actions/checkout registers this bind-mounted path only in its
          # temporary HOME; register the exact path for subsequent container
          # steps so Git's ownership check remains enabled everywhere else.
          git config --global --add safe.directory "$source_root"
          owned_root="$RUNNER_TEMP/agenc-owned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          first_source="$owned_root/source-first"
          second_source="$owned_root/source-second"
          first="$owned_root/artifact-first"
          second="$owned_root/artifact-second"
          cleanup() {
            git -C "$source_root" worktree remove --force "$first_source" 2>/dev/null || true
            git -C "$source_root" worktree remove --force "$second_source" 2>/dev/null || true
            git -C "$source_root" worktree prune --expire=now
            rm -rf "$owned_root"
          }
          trap cleanup EXIT INT TERM
          cleanup
          mkdir -p "$owned_root"
          git worktree add --detach "$first_source" "$GITHUB_SHA"
          git worktree add --detach "$second_source" "$GITHUB_SHA"
          for build in first second; do
            if test "$build" = first; then
              build_source="$first_source"
              build_output="$first"
            else
              build_source="$second_source"
              build_output="$second"
            fi
            test "$(git -C "$build_source" rev-parse HEAD)" = "$GITHUB_SHA"
            test -z "$(git -C "$build_source" status --porcelain=v1 --untracked-files=all)"
            "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" ci --prefix "$build_source" \
              --cache "$owned_root/npm-cache-$build" --no-audit --no-fund
            AGENC_RELEASE_OUT_DIR="$build_output" \
              "$AGENC_NODE_EXECUTABLE_PATH" \
                "$build_source/packages/agenc/scripts/build-runtime-tarball.mjs"
          done
          "$AGENC_NODE_EXECUTABLE_PATH" \
            "$source_root/packages/agenc/scripts/verify-reproducible-artifacts.mjs" \
            --first "$first" --second "$second" \
            --output "$source_root/packages/agenc/release-artifacts"
      - name: Stage the immutable Node compatibility bootstrap
        if: steps.node_bootstrap_release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$AGENC_NODE_BOOTSTRAP_PATH" packages/agenc/release-artifacts/
      - name: Select the canonical runtime subject and bundle path
        id: runtime-artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(packages/agenc/release-artifacts/agenc-runtime-*.tar.gz)
          test "${#artifacts[@]}" -eq 1
          artifact="${artifacts[0]}"
          test "$(basename "$artifact")" = \
            "agenc-runtime-$("$AGENC_NODE_EXECUTABLE_PATH" -p 'require("./runtime/package.json").version')-${{ matrix.slug }}-node26-abi147.tar.gz"
          test -f "${artifact}.meta.json"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "metadata=${artifact}.meta.json" >> "$GITHUB_OUTPUT"
          echo "bundle=${artifact}.sigstore.json" >> "$GITHUB_OUTPUT"
          bootstraps=(packages/agenc/release-artifacts/agenc-node-bootstrap-libatomic-*.tar.gz)
          if test "$AGENC_PUBLISH_NODE_BOOTSTRAP" = true; then
            test "${#bootstraps[@]}" -eq 1
            echo "bootstrap=${bootstraps[0]}" >> "$GITHUB_OUTPUT"
          else
            test "${#bootstraps[@]}" -eq 0
          fi
      - name: Attest runtime artifact provenance
        id: attest-runtime
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ steps.runtime-artifact.outputs.path }}
            ${{ steps.runtime-artifact.outputs.metadata }}
      - name: Attest the immutable Node compatibility bootstrap
        if: steps.node_bootstrap_release.outputs.publish == 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.runtime-artifact.outputs.bootstrap }}
      - name: Bind the action-produced bundle to its canonical release name
        shell: bash
        env:
          ACTION_BUNDLE_PATH: ${{ steps.attest-runtime.outputs.bundle-path }}
          CANONICAL_BUNDLE_PATH: ${{ steps.runtime-artifact.outputs.bundle }}
        run: |
          set -euo pipefail
          python3.12 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import stat

          source_text = os.environ.get("ACTION_BUNDLE_PATH", "")
          destination_text = os.environ.get("CANONICAL_BUNDLE_PATH", "")
          if not source_text or not destination_text:
              raise SystemExit("actions/attest did not return a canonicalizable bundle path")
          source = pathlib.Path(source_text)
          source_metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode):
              raise SystemExit("actions/attest bundle is not one regular file")
          if source_metadata.st_size <= 0 or source_metadata.st_size > 4 * 1024 * 1024:
              raise SystemExit("actions/attest bundle is outside the 4 MiB release bound")
          with source.open("r", encoding="utf-8") as bundle:
              parsed = json.load(bundle)
          if not isinstance(parsed, dict):
              raise SystemExit("actions/attest bundle root is not a JSON object")
          destination = pathlib.Path(destination_text)
          release_root = pathlib.Path("packages/agenc/release-artifacts").resolve(strict=True)
          if (
              destination.parent.resolve(strict=True) != release_root
              or destination.exists()
              or destination.is_symlink()
          ):
              raise SystemExit("refusing a detached or pre-existing canonical bundle path")
          shutil.copyfile(source, destination, follow_symlinks=False)
          destination.chmod(0o644)
          print(f"bound {source} to {destination}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenc-runtime-${{ matrix.slug }}
          path: |
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz
            packages/agenc/release-artifacts/agenc-runtime-*.meta.json
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz.sigstore.json
            packages/agenc/release-artifacts/agenc-node-bootstrap-libatomic-*.tar.gz
          if-no-files-found: error

  native-tarball:
    name: native-tarball (${{ matrix.runner }}, ${{ matrix.slug }})
    if: inputs.phase == 'candidate'
    needs:
      - release-source
      - hosted-toolchain-preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            slug: darwin-arm64
          - runner: macos-15-intel
            slug: darwin-x64
          - runner: windows-2025-vs2026
            slug: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AGENC_RELEASE_CANDIDATE_EVIDENCE_SHA256: ${{ inputs.local_evidence_sha256 }}
      AGENC_RELEASE_CANDIDATE_PHASE: candidate
      AGENC_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
      AGENC_RELEASE_CANDIDATE_RUN_ID: ${{ github.run_id }}
      AGENC_RELEASE_CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENC_RELEASE_CANDIDATE_SOURCE_REF: refs/heads/main
      AGENC_RELEASE_CANDIDATE_WORKFLOW: release-runtime.yml
      AGENC_RELEASE_SLUG: ${{ matrix.slug }}
      AGENC_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Reject retried candidate artifact production
        shell: bash
        run: |
          set -euo pipefail
          require_first_workflow_attempt() {
            if test "$1" != "1"; then
              echo "candidate artifact jobs cannot be retried; dispatch a fresh candidate workflow" >&2
              return 1
            fi
          }
          require_first_workflow_attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Revalidate the reviewed macOS image and native toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-hosted-macos-runner.py \
            --report "$RUNNER_TEMP/agenc-hosted-toolchain-${AGENC_RELEASE_SLUG}.json"
      - name: Revalidate and activate the reviewed Windows image and native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/validate-hosted-windows-runner.ps1 `
            -ReportPath "$env:RUNNER_TEMP/agenc-hosted-toolchain-$env:AGENC_RELEASE_SLUG.json"
      - name: Install digest-pinned Node, headers, and npm (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          node_file="$(python3 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["file"])')"
          node_sha="$(python3 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["sha256"])')"
          node_bytes="$(python3 -c 'import json,os; print(json.load(open("release-toolchain.json"))["nodeDistributions"][os.environ["AGENC_RELEASE_SLUG"]]["bytes"])')"
          headers_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["file"])')"
          headers_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["sha256"])')"
          headers_bytes="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["nodeHeaders"]["bytes"])')"
          npm_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["file"])')"
          npm_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["url"])')"
          npm_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["npmDistribution"]["sha256"])')"
          node_archive="$RUNNER_TEMP/$node_file"
          headers_archive="$RUNNER_TEMP/$headers_file"
          npm_archive="$RUNNER_TEMP/$npm_file"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://nodejs.org/dist/v${NODE_VERSION}/${node_file}" --output "$node_archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://nodejs.org/dist/v${NODE_VERSION}/${headers_file}" --output "$headers_archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$npm_url" --output "$npm_archive"
          test "$(shasum -a 256 "$node_archive" | awk '{print $1}')" = "$node_sha"
          test "$(shasum -a 256 "$headers_archive" | awk '{print $1}')" = "$headers_sha"
          test "$(shasum -a 256 "$npm_archive" | awk '{print $1}')" = "$npm_sha"
          test "$(stat -f '%z' "$node_archive")" = "$node_bytes"
          test "$(stat -f '%z' "$headers_archive")" = "$headers_bytes"
          node_root="$RUNNER_TEMP/node-distribution"
          headers_parent="$RUNNER_TEMP/node-headers"
          mkdir -p "$node_root" "$headers_parent"
          tar -xzf "$node_archive" --strip-components=1 -C "$node_root"
          tar -xzf "$headers_archive" -C "$headers_parent"
          headers_root="$headers_parent/node-v${NODE_VERSION}"
          test -f "$headers_root/include/node/node.h"
          "$node_root/bin/node" "$node_root/lib/node_modules/npm/bin/npm-cli.js" \
            install --global "$npm_archive" --prefix "$node_root" \
            --ignore-scripts --no-audit --no-fund
          node_executable="$node_root/bin/node"
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test "$("$node_executable" --version)" = "v$NODE_VERSION"
          test "$("$node_executable" "$npm_cli" --version)" = "$NPM_VERSION"
          echo "$node_root/bin" >> "$GITHUB_PATH"
          echo "AGENC_NODE_EXECUTABLE_PATH=$node_executable" >> "$GITHUB_ENV"
          echo "AGENC_NPM_CLI_PATH=$npm_cli" >> "$GITHUB_ENV"
          echo "npm_config_nodedir=$headers_root" >> "$GITHUB_ENV"
          echo "AGENC_NODE_DISTRIBUTION_SHA256=$node_sha" >> "$GITHUB_ENV"
          echo "AGENC_NODE_HEADERS_SHA256=$headers_sha" >> "$GITHUB_ENV"
          echo "AGENC_NPM_DISTRIBUTION_SHA256=$npm_sha" >> "$GITHUB_ENV"
      - name: Install digest-pinned Node, headers, and npm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Get-Content -Raw release-toolchain.json | ConvertFrom-Json
          $distribution = $toolchain.nodeDistributions.PSObject.Properties[$env:AGENC_RELEASE_SLUG].Value
          if ($null -eq $distribution) { throw "missing Node distribution for $env:AGENC_RELEASE_SLUG" }
          $importLibrary = $toolchain.nodeImportLibraries.PSObject.Properties[$env:AGENC_RELEASE_SLUG].Value
          if ($null -eq $importLibrary) { throw "missing Node import library for $env:AGENC_RELEASE_SLUG" }
          $nodeArchive = Join-Path $env:RUNNER_TEMP $distribution.file
          $headersArchive = Join-Path $env:RUNNER_TEMP $toolchain.nodeHeaders.file
          $npmArchive = Join-Path $env:RUNNER_TEMP $toolchain.npmDistribution.file
          $nodeImportLibrary = Join-Path $env:RUNNER_TEMP $importLibrary.file
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/$($distribution.file)" -OutFile $nodeArchive
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/$($toolchain.nodeHeaders.file)" -OutFile $headersArchive
          Invoke-WebRequest -Uri $toolchain.npmDistribution.url -OutFile $npmArchive
          Invoke-WebRequest -Uri $importLibrary.url -OutFile $nodeImportLibrary
          function Assert-Sha256([string]$Path, [string]$Expected) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($actual -cne $Expected) { throw "digest mismatch for ${Path}: $actual != $Expected" }
          }
          function Assert-Bytes([string]$Path, [long]$Expected) {
            $actual = (Get-Item -LiteralPath $Path).Length
            if ($actual -ne $Expected) { throw "byte count mismatch for ${Path}: $actual != $Expected" }
          }
          Assert-Sha256 $nodeArchive $distribution.sha256
          Assert-Sha256 $headersArchive $toolchain.nodeHeaders.sha256
          Assert-Sha256 $npmArchive $toolchain.npmDistribution.sha256
          Assert-Sha256 $nodeImportLibrary $importLibrary.sha256
          Assert-Bytes $nodeArchive $distribution.bytes
          Assert-Bytes $headersArchive $toolchain.nodeHeaders.bytes
          Assert-Bytes $nodeImportLibrary $importLibrary.bytes
          $distributionParent = Join-Path $env:RUNNER_TEMP 'node-distribution'
          $headersParent = Join-Path $env:RUNNER_TEMP 'node-headers'
          New-Item -ItemType Directory -Force -Path $distributionParent, $headersParent | Out-Null
          Expand-Archive -LiteralPath $nodeArchive -DestinationPath $distributionParent
          & tar.exe -xzf $headersArchive -C $headersParent
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract Node headers' }
          $nodeRoot = Join-Path $distributionParent "node-v$env:NODE_VERSION-win-x64"
          $headersRoot = Join-Path $headersParent "node-v$env:NODE_VERSION"
          if (-not (Test-Path -LiteralPath (Join-Path $headersRoot 'include\node\node.h') -PathType Leaf)) {
            throw 'extracted Node headers are incomplete'
          }
          $headersRelease = Join-Path $headersRoot 'Release'
          New-Item -ItemType Directory -Force -Path $headersRelease | Out-Null
          $headersNodeImportLibrary = Join-Path $headersRelease $importLibrary.file
          Copy-Item -LiteralPath $nodeImportLibrary -Destination $headersNodeImportLibrary
          Assert-Sha256 $headersNodeImportLibrary $importLibrary.sha256
          Assert-Bytes $headersNodeImportLibrary $importLibrary.bytes
          $nodeExecutablePath = Join-Path $nodeRoot 'node.exe'
          $npmCliPath = Join-Path $nodeRoot 'node_modules\npm\bin\npm-cli.js'
          if (-not (Test-Path -LiteralPath $nodeExecutablePath -PathType Leaf)) { throw 'pinned Node executable is missing' }
          if (-not (Test-Path -LiteralPath $npmCliPath -PathType Leaf)) { throw 'bundled npm CLI is missing' }
          & $nodeExecutablePath $npmCliPath install --global $npmArchive --prefix $nodeRoot --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'failed to install pinned npm archive' }
          if (-not (Test-Path -LiteralPath $npmCliPath -PathType Leaf)) { throw 'pinned npm CLI is missing' }
          if ((& $nodeExecutablePath --version) -cne "v$env:NODE_VERSION") { throw 'Node version mismatch' }
          $actualNpmVersion = (& $nodeExecutablePath $npmCliPath --version).Trim()
          if ($actualNpmVersion -cne $env:NPM_VERSION) {
            throw "npm version mismatch at ${npmCliPath}: '$actualNpmVersion' != '$env:NPM_VERSION'"
          }
          $headerProof = & $nodeExecutablePath packages/agenc/scripts/prepare-windows-node-headers.mjs --root $headersRoot | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'failed to prepare deterministic Windows Node headers' }
          if ($headerProof.sha256 -cne $toolchain.nodeHeaders.windowsCommonGypi.releaseSha256) {
            throw 'sanitized Node common.gypi digest mismatch'
          }
          $nodeRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "AGENC_NODE_EXECUTABLE_PATH=$nodeExecutablePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NPM_CLI_PATH=$npmCliPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_nodedir=$headersRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NODE_DISTRIBUTION_SHA256=$($distribution.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NODE_HEADERS_SHA256=$($toolchain.nodeHeaders.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NODE_IMPORT_LIBRARY_SHA256=$($importLibrary.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NODE_IMPORT_LIBRARY_BYTES=$($importLibrary.bytes)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NODE_COMMON_GYPI_SHA256=$($headerProof.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENC_NPM_DISTRIBUTION_SHA256=$($toolchain.npmDistribution.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native probes and build from two isolated worktrees
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          test "$("$AGENC_NODE_EXECUTABLE_PATH" --version)" = "v$NODE_VERSION"
          test "$("$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" --version)" = "$NPM_VERSION"
          source_root="$(pwd -P)"
          runner_temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          owned_root="$runner_temp/agenc-owned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          first_source="$owned_root/source-first"
          second_source="$owned_root/source-second"
          first="$owned_root/artifact-first"
          second="$owned_root/artifact-second"
          native_results="$owned_root/native-test-results.json"
          case "$AGENC_RELEASE_SLUG" in
            darwin-arm64|darwin-x64)
              native_tests=(
                "tests/fnd/bounded-file-io.test.ts"
                "tests/fnd/fnd-fixtures.test.ts"
                "tests/fnd/portable-repository-path.test.ts"
                "tests/fnd/process-repository-helpers.native.test.ts"
                "tests/tools/runtimes/runtime.darwin.test.ts"
              )
              expected_native_tests=47
              expected_native_suites=8
              ;;
            win-x64)
              native_tests=(
                "tests/durability/atomic-artifact.win32.test.ts"
                "tests/fnd/bounded-file-io.test.ts"
                "tests/fnd/fnd-fixtures.test.ts"
                "tests/fnd/portable-repository-path.test.ts"
                "tests/fnd/process-repository-helpers.native.test.ts"
                "tests/utils/execFileNoThrow.win32.test.ts"
                "tests/workspace/bound-helper-transport.win32.test.ts"
              )
              expected_native_tests=50
              expected_native_suites=12
              ;;
            *)
              echo "unsupported native release slug: $AGENC_RELEASE_SLUG" >&2
              exit 1
              ;;
          esac
          cleanup() {
            git -C "$source_root" worktree remove --force "$first_source" 2>/dev/null || true
            git -C "$source_root" worktree remove --force "$second_source" 2>/dev/null || true
            git -C "$source_root" worktree prune --expire=now
            rm -rf "$owned_root"
          }
          trap cleanup EXIT INT TERM
          cleanup
          mkdir -p "$owned_root"
          git worktree add --detach "$first_source" "$GITHUB_SHA"
          git worktree add --detach "$second_source" "$GITHUB_SHA"
          for build in first second; do
            if test "$build" = first; then
              build_source="$first_source"
              build_output="$first"
            else
              build_source="$second_source"
              build_output="$second"
            fi
            test "$(git -C "$build_source" rev-parse HEAD)" = "$GITHUB_SHA"
            test -z "$(git -C "$build_source" status --porcelain=v1 --untracked-files=all)"
            "$AGENC_NODE_EXECUTABLE_PATH" "$AGENC_NPM_CLI_PATH" ci --prefix "$build_source" \
              --cache "$owned_root/npm-cache-$build" --no-audit --no-fund
            if test "$build" = first; then
              "$AGENC_NODE_EXECUTABLE_PATH" \
                "$build_source/runtime/scripts/run-hermetic-vitest.mjs" \
                --require-zero-skips \
                run "${native_tests[@]}" \
                --config "$build_source/runtime/vitest.native.config.ts" \
                --allowOnly=false \
                --reporter=verbose \
                --reporter=json \
                --outputFile.json "$native_results"
              "$AGENC_NODE_EXECUTABLE_PATH" --input-type=module - \
                "$native_results" "$expected_native_tests" \
                "$expected_native_suites" "${native_tests[@]}" <<'NODE'
          import { readFileSync } from "node:fs";

          const [
            resultsPath,
            expectedTestsText,
            expectedSuitesText,
            ...expectedFiles
          ] = process.argv.slice(2);
          const expectedTests = Number.parseInt(expectedTestsText ?? "", 10);
          const expectedSuites = Number.parseInt(expectedSuitesText ?? "", 10);
          if (
            !resultsPath ||
            expectedFiles.length < 1 ||
            !Number.isSafeInteger(expectedTests) ||
            expectedTests < 1 ||
            !Number.isSafeInteger(expectedSuites) ||
            expectedSuites < 1
          ) {
            throw new Error("invalid native-test result assertion inputs");
          }
          const results = JSON.parse(readFileSync(resultsPath, "utf8"));
          const exactCounts = {
            numTotalTestSuites: expectedSuites,
            numPassedTestSuites: expectedSuites,
            numFailedTestSuites: 0,
            numPendingTestSuites: 0,
            numTotalTests: expectedTests,
            numPassedTests: expectedTests,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [field, value] of Object.entries(exactCounts)) {
            if (results[field] !== value) {
              throw new Error(
                `native-test result ${field} was ${results[field]}, expected ${value}`,
              );
            }
          }
          if (results.success !== true || !Array.isArray(results.testResults)) {
            throw new Error("native-test result did not report success");
          }
          const files = results.testResults
            .map(result => String(result.name).split("\\").join("/"))
            .map(file => expectedFiles.find(expectedFile =>
              file.endsWith(`/runtime/${expectedFile}`),
            ) ?? file)
            .sort();
          expectedFiles.sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            throw new Error(
              `native-test files were ${JSON.stringify(files)}, expected ${JSON.stringify(expectedFiles)}`,
            );
          }
          console.log(
            `hosted FND/native integration probe passed ${expectedTests} test(s) in ${expectedFiles.length} file(s) with zero skipped`,
          );
          NODE
              test -z "$(git -C "$build_source" status --porcelain=v1 --untracked-files=all)"
            fi
            AGENC_RELEASE_OUT_DIR="$build_output" \
              "$AGENC_NODE_EXECUTABLE_PATH" \
                "$build_source/packages/agenc/scripts/build-runtime-tarball.mjs"
          done
          if ! "$AGENC_NODE_EXECUTABLE_PATH" \
            "$source_root/packages/agenc/scripts/verify-reproducible-artifacts.mjs" \
            --first "$first" --second "$second" \
            --output "$source_root/packages/agenc/release-artifacts"; then
            diagnostics="$runner_temp/agenc-repro-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
            rm -rf "$diagnostics"
            mkdir -p "$diagnostics/first" "$diagnostics/second"
            cp "$first"/* "$diagnostics/first/"
            cp "$second"/* "$diagnostics/second/"
            exit 1
          fi
      - name: Upload failed reproducibility inputs
        if: failure() && github.run_attempt == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-diagnostics-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agenc-repro-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Select the canonical runtime subject and bundle path
        id: runtime-artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(packages/agenc/release-artifacts/agenc-runtime-*.tar.gz)
          test "${#artifacts[@]}" -eq 1
          artifact="${artifacts[0]}"
          test "$(basename "$artifact")" = \
            "agenc-runtime-$("$AGENC_NODE_EXECUTABLE_PATH" -p 'require("./runtime/package.json").version')-${{ matrix.slug }}-node26-abi147.tar.gz"
          test -f "${artifact}.meta.json"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "metadata=${artifact}.meta.json" >> "$GITHUB_OUTPUT"
          echo "bundle=${artifact}.sigstore.json" >> "$GITHUB_OUTPUT"
      - name: Attest runtime artifact provenance
        id: attest-runtime
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ steps.runtime-artifact.outputs.path }}
            ${{ steps.runtime-artifact.outputs.metadata }}
      - name: Bind the action-produced bundle to its canonical release name
        shell: bash
        env:
          ACTION_BUNDLE_PATH: ${{ steps.attest-runtime.outputs.bundle-path }}
          CANONICAL_BUNDLE_PATH: ${{ steps.runtime-artifact.outputs.bundle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import stat

          source_text = os.environ.get("ACTION_BUNDLE_PATH", "")
          destination_text = os.environ.get("CANONICAL_BUNDLE_PATH", "")
          if not source_text or not destination_text:
              raise SystemExit("actions/attest did not return a canonicalizable bundle path")
          source = pathlib.Path(source_text)
          source_metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode):
              raise SystemExit("actions/attest bundle is not one regular file")
          if source_metadata.st_size <= 0 or source_metadata.st_size > 4 * 1024 * 1024:
              raise SystemExit("actions/attest bundle is outside the 4 MiB release bound")
          with source.open("r", encoding="utf-8") as bundle:
              parsed = json.load(bundle)
          if not isinstance(parsed, dict):
              raise SystemExit("actions/attest bundle root is not a JSON object")
          destination = pathlib.Path(destination_text)
          release_root = pathlib.Path("packages/agenc/release-artifacts").resolve(strict=True)
          if (
              destination.parent.resolve(strict=True) != release_root
              or destination.exists()
              or destination.is_symlink()
          ):
              raise SystemExit("refusing a detached or pre-existing canonical bundle path")
          shutil.copyfile(source, destination, follow_symlinks=False)
          destination.chmod(0o644)
          print(f"bound {source} to {destination}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenc-runtime-${{ matrix.slug }}
          path: |
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz
            packages/agenc/release-artifacts/agenc-runtime-*.meta.json
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz.sigstore.json
          if-no-files-found: error

  candidate-seal:
    name: candidate-seal
    if: inputs.phase == 'candidate'
    needs:
      - release-source
      - linux-tarball
      - native-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Reject retried candidate artifact production
        shell: bash
        run: |
          set -euo pipefail
          require_first_workflow_attempt() {
            if test "$1" != "1"; then
              echo "candidate artifact jobs cannot be retried; dispatch a fresh candidate workflow" >&2
              return 1
            fi
          }
          require_first_workflow_attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install checksum-pinned GitHub CLI verifier
        shell: bash
        run: |
          set -euo pipefail
          gh_version="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["version"])')"
          gh_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["file"])')"
          gh_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["url"])')"
          gh_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["sha256"])')"
          test "$gh_version" = "2.96.0"
          gh_archive="$RUNNER_TEMP/$gh_file"
          gh_root="$RUNNER_TEMP/github-cli"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error "$gh_url" --output "$gh_archive"
          test "$(sha256sum "$gh_archive" | cut -d ' ' -f 1)" = "$gh_sha"
          mkdir -m 700 "$gh_root"
          tar -xzf "$gh_archive" --strip-components=1 -C "$gh_root"
          test "$("$gh_root/bin/gh" --version | awk 'NR == 1 { print $3 }')" = "$gh_version"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
      - name: Download all candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agenc-runtime-*
          path: ${{ runner.temp }}/candidate-artifacts
          merge-multiple: true
      - name: Seal the exact candidate inventory at current main
        id: candidate-receipt
        env:
          CANDIDATE_ARTIFACTS_DIR: ${{ runner.temp }}/candidate-artifacts
          GH_CONFIG_DIR: ${{ runner.temp }}/candidate-seal-gh-config
          GH_NO_UPDATE_NOTIFIER: "true"
          GH_PROMPT_DISABLED: "true"
          GH_SPINNER_DISABLED: "true"
          GH_TOKEN: ${{ github.token }}
          LOCAL_EVIDENCE_SHA256: ${{ inputs.local_evidence_sha256 }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          release_tag_exists() {
            git show-ref --verify --quiet "$1"
          }
          mkdir -m 700 "$GH_CONFIG_DIR"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$TESTED_SHA"
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          expected_ref="refs/tags/agenc-v${version}"
          git fetch origin main --tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$TESTED_SHA"
          if release_tag_exists "$expected_ref"; then
            echo "candidate seal refuses an already-consumed release tag: $expected_ref" >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          seal_root="$RUNNER_TEMP/agenc-runtime-candidate-seal"
          mkdir -m 700 "$seal_root"
          receipt="$seal_root/agenc-runtime-candidate-seal.json"
          bundle="${receipt}.sigstore.json"
          python3 scripts/release_candidate_policy.py seal \
            --source-dir "$CANDIDATE_ARTIFACTS_DIR" \
            --receipt "$receipt" \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tested-sha "$TESTED_SHA" \
            --evidence-sha256 "$LOCAL_EVIDENCE_SHA256"
          verification_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-runtime.yml"
            --signer-digest "$TESTED_SHA"
            --source-digest "$TESTED_SHA"
            --source-ref refs/heads/main
            --hostname github.com
            --cert-oidc-issuer https://token.actions.githubusercontent.com
            --predicate-type https://slsa.dev/provenance/v1
            --deny-self-hosted-runners
          )
          for slug in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win-x64; do
            archive="$CANDIDATE_ARTIFACTS_DIR/agenc-runtime-${version}-${slug}-node26-abi147.tar.gz"
            metadata="${archive}.meta.json"
            candidate_bundle="${archive}.sigstore.json"
            gh attestation verify "$archive" \
              --bundle "$candidate_bundle" "${verification_args[@]}" >/dev/null
            gh attestation verify "$metadata" \
              --bundle "$candidate_bundle" "${verification_args[@]}" >/dev/null
          done
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Attest the candidate seal
        id: attest-candidate-seal
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.candidate-receipt.outputs.receipt }}
      - name: Bind the candidate seal attestation
        shell: bash
        env:
          ACTION_BUNDLE_PATH: ${{ steps.attest-candidate-seal.outputs.bundle-path }}
          CANONICAL_BUNDLE_PATH: ${{ steps.candidate-receipt.outputs.bundle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import stat

          source = pathlib.Path(os.environ["ACTION_BUNDLE_PATH"])
          destination = pathlib.Path(os.environ["CANONICAL_BUNDLE_PATH"])
          source_metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode):
              raise SystemExit("candidate seal attestation is not one regular file")
          if source_metadata.st_size <= 0 or source_metadata.st_size > 4 * 1024 * 1024:
              raise SystemExit("candidate seal attestation is outside the 4 MiB bound")
          with source.open("r", encoding="utf-8") as bundle:
              parsed = json.load(bundle)
          if not isinstance(parsed, dict):
              raise SystemExit("candidate seal attestation root is not a JSON object")
          if destination.exists() or destination.is_symlink():
              raise SystemExit("refusing a pre-existing candidate seal bundle")
          shutil.copyfile(source, destination, follow_symlinks=False)
          destination.chmod(0o600)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenc-runtime-candidate-seal
          path: |
            ${{ steps.candidate-receipt.outputs.receipt }}
            ${{ steps.candidate-receipt.outputs.bundle }}
          if-no-files-found: error

  promote-candidate-artifacts:
    name: promote-candidate-artifacts (${{ matrix.slug }})
    if: inputs.phase == 'tagged'
    needs: release-source
    strategy:
      fail-fast: false
      matrix:
        slug:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checksum-pinned GitHub CLI verifier
        shell: bash
        run: |
          set -euo pipefail
          gh_version="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["version"])')"
          gh_file="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["file"])')"
          gh_url="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["url"])')"
          gh_sha="$(python3 -c 'import json; print(json.load(open("release-toolchain.json"))["githubCli"]["linuxX64"]["sha256"])')"
          test "$gh_version" = "2.96.0"
          gh_archive="$RUNNER_TEMP/$gh_file"
          gh_root="$RUNNER_TEMP/github-cli"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error "$gh_url" --output "$gh_archive"
          test "$(sha256sum "$gh_archive" | cut -d ' ' -f 1)" = "$gh_sha"
          mkdir -m 700 "$gh_root"
          tar -xzf "$gh_archive" --strip-components=1 -C "$gh_root"
          test "$("$gh_root/bin/gh" --version | awk 'NR == 1 { print $3 }')" = "$gh_version"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
      - name: Download the exact immutable candidate escrow assets
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
          CANDIDATE_ESCROW_TAG: ${{ needs.release-source.outputs.candidate-escrow-tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          version="$(python3 -c 'import json; print(json.load(open("runtime/package.json"))["version"])')"
          expected_candidate_tag="agenc-candidate-v${version}-run-${CANDIDATE_RUN_ID}"
          test "$CANDIDATE_ESCROW_TAG" = "$expected_candidate_tag"
          archive_name="agenc-runtime-${version}-${AGENC_RELEASE_SLUG}-node26-abi147.tar.gz"
          escrow_url="https://github.com/tetsuo-ai/agenc-releases/releases/download/${CANDIDATE_ESCROW_TAG}"
          mkdir -m 700 candidate-seal candidate-artifact
          for name in \
            agenc-runtime-candidate-seal.json \
            agenc-runtime-candidate-seal.json.sigstore.json; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --fail --location --silent --show-error \
              "$escrow_url/$name" --output "candidate-seal/$name"
          done
          for name in \
            "$archive_name" \
            "${archive_name}.meta.json" \
            "${archive_name}.sigstore.json"; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --fail --location --silent --show-error \
              "$escrow_url/$name" --output "candidate-artifact/$name"
          done
      - name: Validate and stage the candidate bytes
        id: runtime-artifact
        env:
          AGENC_RELEASE_SLUG: ${{ matrix.slug }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.release-source.outputs.candidate-run-attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_CONFIG_DIR: ${{ runner.temp }}/candidate-gh-config
          GH_NO_UPDATE_NOTIFIER: "true"
          GH_PROMPT_DISABLED: "true"
          GH_SPINNER_DISABLED: "true"
          GH_TOKEN: ${{ github.token }}
          LOCAL_EVIDENCE_SHA256: ${{ inputs.local_evidence_sha256 }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$GH_CONFIG_DIR"
          version="$(python3 -c 'import json; print(json.load(open("runtime/package.json"))["version"])')"
          archive_name="agenc-runtime-${version}-${AGENC_RELEASE_SLUG}-node26-abi147.tar.gz"
          artifact="candidate-artifact/$archive_name"
          metadata="${artifact}.meta.json"
          candidate_bundle="${artifact}.sigstore.json"
          receipt="candidate-seal/agenc-runtime-candidate-seal.json"
          seal_bundle="${receipt}.sigstore.json"
          test -f "$artifact"
          test ! -L "$artifact"
          test -f "$metadata"
          test ! -L "$metadata"
          test -f "$candidate_bundle"
          test ! -L "$candidate_bundle"
          test -f "$receipt"
          test ! -L "$receipt"
          test -f "$seal_bundle"
          test ! -L "$seal_bundle"
          test "$(find candidate-artifact -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 3
          test "$(find candidate-seal -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 2
          verification_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-runtime.yml"
            --signer-digest "$TESTED_SHA"
            --source-digest "$TESTED_SHA"
            --source-ref refs/heads/main
            --hostname github.com
            --cert-oidc-issuer https://token.actions.githubusercontent.com
            --predicate-type https://slsa.dev/provenance/v1
            --deny-self-hosted-runners
          )
          gh attestation verify "$receipt" \
            --bundle "$seal_bundle" "${verification_args[@]}" >/dev/null
          gh attestation verify "$artifact" \
            --bundle "$candidate_bundle" "${verification_args[@]}" >/dev/null
          gh attestation verify "$metadata" \
            --bundle "$candidate_bundle" "${verification_args[@]}" >/dev/null
          python3 scripts/release_candidate_policy.py promote \
            --receipt "$receipt" \
            --seal-bundle "$seal_bundle" \
            --artifact "$artifact" \
            --metadata "$metadata" \
            --candidate-bundle "$candidate_bundle" \
            --slug "$AGENC_RELEASE_SLUG" \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --tested-sha "$TESTED_SHA" \
            --evidence-sha256 "$LOCAL_EVIDENCE_SHA256"
          release_root=packages/agenc/release-artifacts
          mkdir -p "$release_root"
          cp "$artifact" "$metadata" "$release_root/"
          promoted_artifact="$release_root/$(basename "$artifact")"
          promoted_metadata="$release_root/$(basename "$metadata")"
          promoted_build_bundle="${promoted_artifact}.build.sigstore.json"
          promoted_bundle="${promoted_artifact}.sigstore.json"
          test ! -e "$promoted_build_bundle"
          test ! -e "$promoted_bundle"
          cp "$candidate_bundle" "$promoted_build_bundle"
          echo "path=$promoted_artifact" >> "$GITHUB_OUTPUT"
          echo "metadata=$promoted_metadata" >> "$GITHUB_OUTPUT"
          echo "build-bundle=$promoted_build_bundle" >> "$GITHUB_OUTPUT"
          echo "bundle=$promoted_bundle" >> "$GITHUB_OUTPUT"
      - name: Attest the promoted runtime artifact at the immutable tag
        id: attest-runtime
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ steps.runtime-artifact.outputs.path }}
            ${{ steps.runtime-artifact.outputs.metadata }}
      - name: Bind the promoted bundle to its canonical release name
        shell: bash
        env:
          ACTION_BUNDLE_PATH: ${{ steps.attest-runtime.outputs.bundle-path }}
          CANONICAL_BUNDLE_PATH: ${{ steps.runtime-artifact.outputs.bundle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import stat

          source = pathlib.Path(os.environ["ACTION_BUNDLE_PATH"])
          destination = pathlib.Path(os.environ["CANONICAL_BUNDLE_PATH"])
          source_metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode):
              raise SystemExit("actions/attest bundle is not one regular file")
          if source_metadata.st_size <= 0 or source_metadata.st_size > 4 * 1024 * 1024:
              raise SystemExit("actions/attest bundle is outside the 4 MiB release bound")
          with source.open("r", encoding="utf-8") as bundle:
              parsed = json.load(bundle)
          if not isinstance(parsed, dict):
              raise SystemExit("actions/attest bundle root is not a JSON object")
          release_root = pathlib.Path("packages/agenc/release-artifacts").resolve(strict=True)
          if (
              destination.parent.resolve(strict=True) != release_root
              or destination.exists()
              or destination.is_symlink()
          ):
              raise SystemExit("refusing a detached or pre-existing canonical bundle path")
          shutil.copyfile(source, destination, follow_symlinks=False)
          destination.chmod(0o644)
          print(f"bound {source} to {destination}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenc-runtime-${{ matrix.slug }}
          path: |
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz
            packages/agenc/release-artifacts/agenc-runtime-*.meta.json
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz.build.sigstore.json
            packages/agenc/release-artifacts/agenc-runtime-*.tar.gz.sigstore.json
          if-no-files-found: error
