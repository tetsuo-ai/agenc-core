name: pr-fast

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "memory_todo.md"
      - "todo.txt"

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.5.0"
  NPM_VERSION: "11.17.0"

jobs:
  affected-tests:
    name: affected-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@${NPM_VERSION}" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild node-pty

      - name: Run fast checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:fast -- --base "$BASE_SHA"
