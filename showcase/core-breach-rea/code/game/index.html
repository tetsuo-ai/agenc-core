<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CORE BREACH</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
      color: #dfe7ef;
      font-family: monospace;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, #141b20 0%, #080a0d 55%, #030405 100%);
    }
    #screen {
      width: 960px;
      height: 600px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 40px #000, 0 0 4px #2a4a52;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="screen" width="320" height="200"></canvas></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
